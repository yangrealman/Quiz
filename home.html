<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>양진웅 기출 노트</title>
<meta name="theme-color" content="#F6F3EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&display=swap">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
/* ══════════════════════════════════════════════════════════════
   먹과 종이. 색은 인장 하나에만.
   ══════════════════════════════════════════════════════════════ */
:root {
  --paper:  #F6F3EC;
  --sheet:  #FBF9F4;
  --ink:    #1B1A17;
  --ink-2:  #57544C;
  --ink-3:  #8C877B;
  --rule:   #CFC9BC;
  --rule-2: #E3DED2;
  --seal:   #9E3B2E;
  --edge: clamp(22px, 7vw, 96px);
  --margin-rule: clamp(0px, 4vw, 46px);
  --gutter: calc(var(--edge) + var(--margin-rule) + clamp(18px, 4vw, 40px));
}
html.dark {
  --paper:  #14130F;
  --sheet:  #1B1A15;
  --ink:    #EAE5D9;
  --ink-2:  #A9A395;
  --ink-3:  #7C776B;
  --rule:   #37342C;
  --rule-2: #262419;
  --seal:   #C4614F;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html {
  scroll-snap-type: y proximity;
  scroll-behavior: smooth;
  background: var(--paper);
  -webkit-text-size-adjust: 100%;
}
body {
  font-family: 'Gowun Batang', 'Nanum Myeongjo', Batang, Gungsuh, 'Apple SD Gothic Neo', serif;
  background: var(--paper); color: var(--ink);
  line-height: 1.9; letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; scroll-snap-type: none; }
}

/* 편지지 세로 여백선 */
body::before {
  content: ""; position: fixed; top: 0; bottom: 0;
  left: calc(var(--edge) + var(--margin-rule));
  width: 3px; border-left: 1px solid var(--rule); border-right: 1px solid var(--rule);
  opacity: 0.55; pointer-events: none; z-index: 1;
}
@media (max-width: 640px) { body::before { display: none; } }

/* ── 머리글 ─────────────────────────────────────────────────── */
.head {
  position: fixed; inset: 0 0 auto 0; z-index: 20;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 14px;
  padding: 15px var(--edge) 9px;
  background: color-mix(in srgb, var(--paper) 90%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 3px double var(--rule);
  font-size: 12.5px; color: var(--ink-2);
}
.head-l { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: inherit; min-width: 0; }
.head-t {
  font-family: 'Nanum Myeongjo', serif; font-weight: 700; font-size: 15px; color: var(--ink);
  letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.head-r { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.mark {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  border: 1px solid var(--ink-3); transition: background 0.4s, border-color 0.4s;
}
.mark.ok { background: var(--ink-2); border-color: var(--ink-2); }
.mark.busy { animation: blink 1.2s ease-in-out infinite; }
.mark.off { border-color: var(--seal); }
@keyframes blink { 50% { opacity: 0.25; } }
.hbtn {
  border: 1px solid var(--rule); background: transparent; color: var(--ink-2);
  font: inherit; font-size: 12px; padding: 4px 12px; cursor: pointer;
  text-decoration: none; white-space: nowrap;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}
.hbtn:hover { color: var(--ink); border-color: var(--ink-2); background: var(--sheet); }
@media (max-width: 560px) { .hbtn-wide { display: none; } }

/* 시험지 모드의 진행 눈금 */
.gaugebar { position: absolute; left: 0; right: 0; bottom: -3px; height: 2px; background: transparent; }
.gaugebar i { display: block; height: 100%; background: var(--ink); width: 0; transition: width 0.35s ease; }

/* ── 지면 전환 ─────────────────────────────────────────────── */
.view { display: none; }
body[data-mode="home"]   #deck,
body[data-mode="rounds"] #rounds,
body[data-mode="solve"]  #paper { display: block; }
body[data-mode="home"]   #deck  { display: block; }
body:not([data-mode="home"]) #deck { display: none; }
body:not([data-mode="home"]) .foot { display: none; }

/* ── 장 ─────────────────────────────────────────────────────── */
.leaf {
  min-height: 100svh; scroll-snap-align: start;
  display: flex; flex-direction: column; justify-content: center;
  padding: 112px var(--edge) 92px; padding-left: var(--gutter);
  position: relative;
}
.leaf + .leaf::before {
  content: ""; position: absolute; top: 0; left: var(--gutter); right: var(--edge);
  border-top: 1px solid var(--rule-2);
}
.col { width: 100%; max-width: 620px; }

.tag { font-size: 12px; color: var(--ink-3); letter-spacing: 0.22em; margin: 0 0 26px; }
h1, h2 {
  font-family: 'Nanum Myeongjo', Batang, Gungsuh, serif;
  font-weight: 800; letter-spacing: -0.02em; line-height: 1.4; margin: 0; color: var(--ink);
}
h1 { font-size: clamp(27px, 5.4vw, 44px); }
h2 { font-size: clamp(22px, 4vw, 33px); }
.body { margin: 22px 0 0; font-size: 15.5px; color: var(--ink-2); max-width: 40ch; }
.body strong { font-weight: 700; color: var(--ink); }

[data-in] {
  opacity: 0; transform: translateY(14px);
  transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.22,1,0.36,1);
  transition-delay: calc(var(--i, 0) * 90ms);
}
.leaf.on [data-in] { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  [data-in] { opacity: 1 !important; transform: none !important; transition: none !important; }
}

/* ── 붓 ─────────────────────────────────────────────────────── */
.acts { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 34px; }
.go {
  font: inherit; font-size: 14.5px; display: inline-flex; align-items: center; gap: 9px;
  padding: 11px 24px; cursor: pointer; text-decoration: none;
  border: 1px solid var(--ink); background: transparent; color: var(--ink);
  transition: background 0.22s, color 0.22s, transform 0.16s, border-color 0.22s;
}
.go:hover { background: var(--ink); color: var(--paper); transform: translateY(-2px); }
.go:active { transform: translateY(0); }
.go-2 { border-color: var(--rule); color: var(--ink-2); }
.go-2:hover { background: transparent; color: var(--ink); border-color: var(--ink-2); }

/* ── 남은 날 ────────────────────────────────────────────────── */
.count {
  font-family: 'Nanum Myeongjo', Batang, Gungsuh, serif;
  font-size: clamp(66px, 17vw, 148px); font-weight: 800;
  letter-spacing: -0.05em; line-height: 1; display: inline-block;
  margin: 14px 0 0; padding-bottom: 10px;
  border-bottom: 2px solid var(--seal); font-variant-numeric: tabular-nums;
}
.count small { font-size: 0.26em; font-weight: 400; color: var(--ink-2); letter-spacing: 0; margin-left: 8px; }
.lines { margin-top: 30px; }
.line { display: flex; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px dotted var(--rule); font-size: 14px; }
.line-k { color: var(--ink-3); min-width: 76px; }
.line-v { color: var(--ink); font-variant-numeric: tabular-nums; }

/* ── 차례식 목록 ────────────────────────────────────────────── */
.toc { margin-top: 30px; border-top: 1px solid var(--rule); }
.toc a, .toc button {
  display: flex; align-items: baseline; gap: 10px; width: 100%;
  padding: 15px 2px; border: none; border-bottom: 1px solid var(--rule-2);
  background: transparent; text-align: left; font: inherit; color: inherit;
  text-decoration: none; cursor: pointer;
  transition: color 0.2s, padding-left 0.2s;
}
.toc a:hover, .toc button:hover { color: var(--seal); padding-left: 7px; }
.toc-t { font-size: 16px; font-weight: 700; white-space: nowrap; }
.toc-d { flex: 1; border-bottom: 1px dotted var(--rule); transform: translateY(-4px); }
.toc-n { font-size: 15.5px; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink-2); }
.toc-s { display: block; font-size: 12.5px; color: var(--ink-3); font-weight: 400; margin-top: 1px; }

/* ── 성적표식 표 ────────────────────────────────────────────── */
.sheet { margin-top: 30px; border-top: 2px solid var(--ink); }
.trow { padding: 15px 2px 12px; border-bottom: 1px solid var(--rule-2); }
.trow-h { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
.trow-n { font-size: 16.5px; font-weight: 700; }
.trow-p { font-size: 15px; font-variant-numeric: tabular-nums; }
.trow-s { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.gauge { height: 2px; background: var(--rule-2); margin-top: 11px; }
.gauge i { display: block; height: 100%; background: var(--ink); width: 0; transition: width 1s cubic-bezier(0.22,1,0.36,1); }

.note {
  margin-top: 26px; padding: 20px 22px; border: 1px solid var(--rule); background: var(--sheet);
  font-size: 14px; color: var(--ink-2); max-width: 42ch;
}
.note b { display: block; color: var(--ink); font-weight: 700; margin-bottom: 5px; font-size: 15px; }

.turn {
  position: absolute; bottom: 40px; left: var(--gutter);
  border: none; background: none; padding: 0; cursor: pointer;
  font: inherit; font-size: 12px; color: var(--ink-3); letter-spacing: 0.16em;
  display: inline-flex; align-items: center; gap: 9px;
  transition: color 0.2s, gap 0.2s;
}
.turn:hover { color: var(--ink); gap: 14px; }
.turn span:last-child { font-size: 14px; }

.seal {
  margin-top: 40px; width: 62px; height: 62px;
  border: 2px solid var(--seal); border-radius: 3px; color: var(--seal);
  font-family: 'Nanum Myeongjo', Batang, Gungsuh, serif; font-weight: 700; font-size: 15px;
  writing-mode: vertical-rl; text-orientation: upright;
  display: flex; align-items: center; justify-content: center; letter-spacing: 0.1em; opacity: 0.9;
}

.foot {
  padding: 34px var(--edge) 44px; padding-left: var(--gutter);
  border-top: 3px double var(--rule); font-size: 12px; color: var(--ink-3);
  display: flex; flex-wrap: wrap; gap: 6px 20px;
}
.foot a { color: var(--ink-2); text-decoration: none; border-bottom: 1px solid var(--rule); }
.foot a:hover { color: var(--ink); border-color: var(--ink-2); }

/* ══════════════════════════════════════════════════════════════
   회차 고르기
   ══════════════════════════════════════════════════════════════ */
#rounds { padding: 112px var(--edge) 90px; padding-left: var(--gutter); }
.pick-h { max-width: 620px; }
.pick-list { max-width: 620px; }

/* ══════════════════════════════════════════════════════════════
   시험지 — 문항을 한 장씩
   ══════════════════════════════════════════════════════════════ */
.q-leaf {
  min-height: 100svh; scroll-snap-align: start;
  display: flex; flex-direction: column; justify-content: center;
  padding: 108px var(--edge) 96px; padding-left: var(--gutter);
  position: relative;
}
.q-leaf + .q-leaf::before {
  content: ""; position: absolute; top: 0; left: var(--gutter); right: var(--edge);
  border-top: 1px solid var(--rule-2);
}
.q-col { width: 100%; max-width: 660px; }

.q-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.q-no {
  font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 22px;
  font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
}
.q-no small { font-size: 12px; font-weight: 400; color: var(--ink-3); margin-left: 7px; letter-spacing: 0.1em; }
.q-tools { display: flex; gap: 6px; }
.qt {
  border: 1px solid var(--rule); background: transparent; color: var(--ink-3);
  font: inherit; font-size: 11.5px; padding: 3px 10px; cursor: pointer;
  transition: color 0.2s, border-color 0.2s;
}
.qt:hover { color: var(--ink); border-color: var(--ink-2); }
.qt.on { color: var(--ink); border-color: var(--ink); }

.q-ask {
  font-family: 'Nanum Myeongjo', Batang, Gungsuh, serif;
  font-size: clamp(17px, 2.4vw, 20px); line-height: 1.95; margin: 0;
  white-space: pre-wrap; word-break: keep-all;
}
.q-fig { margin-top: 18px; }
.q-fig img { max-width: 100%; border: 1px solid var(--rule); background: var(--sheet); display: block; }
.q-fig .loading { font-size: 12.5px; color: var(--ink-3); }

.opts { list-style: none; margin: 26px 0 0; padding: 0; border-top: 1px solid var(--rule); }
.opt {
  display: flex; align-items: baseline; gap: 12px; width: 100%;
  padding: 13px 8px 13px 4px; border: none; border-bottom: 1px solid var(--rule-2);
  border-left: 2px solid transparent;
  background: transparent; font: inherit; font-size: 15.5px; text-align: left;
  color: var(--ink); cursor: pointer; line-height: 1.75;
  transition: background 0.18s, border-left-color 0.18s, color 0.18s, padding-left 0.18s;
}
.opt:hover:not(:disabled) { background: var(--sheet); padding-left: 10px; }
.opt:disabled { cursor: default; }
.opt-n { font-family: 'Nanum Myeongjo', serif; font-size: 16px; flex-shrink: 0; width: 1.4em; }
.opt-t { flex: 1; white-space: pre-wrap; word-break: keep-all; }
.opt-m { flex-shrink: 0; font-size: 15px; color: var(--ink-3); }

/* 채점 표시 — 색 없이 부호와 굵기로만 */
.opt.is-answer { border-left-color: var(--ink); font-weight: 700; }
.opt.is-answer .opt-m::after { content: "○"; }
.opt.picked-bad { color: var(--ink-3); }
.opt.picked-bad .opt-t { text-decoration: line-through; text-decoration-thickness: 1px; }
.opt.picked-bad .opt-m::after { content: "✕"; }

.judged .q-no::after { content: ""; }
.q-verdict {
  margin-top: 22px; font-size: 14px; color: var(--ink-2);
  display: flex; align-items: baseline; gap: 10px;
}
.q-verdict b { font-family: 'Nanum Myeongjo', serif; font-size: 17px; color: var(--ink); }

.why {
  margin-top: 20px; padding: 18px 20px; border: 1px solid var(--rule); background: var(--sheet);
  font-size: 14.5px; color: var(--ink-2); line-height: 1.95; white-space: pre-wrap; word-break: keep-all;
}
.why-k {
  display: block; font-family: 'Nanum Myeongjo', serif; font-size: 12px; letter-spacing: 0.2em;
  color: var(--ink-3); margin-bottom: 8px;
}

/* 주관식 */
.write {
  width: 100%; margin-top: 22px; padding: 14px 16px; min-height: 128px; resize: vertical;
  border: 1px solid var(--rule); background: var(--sheet); color: var(--ink);
  font: inherit; font-size: 15.5px; line-height: 1.95;
}
.write:focus { outline: none; border-color: var(--ink-2); }
.subj-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.model { margin-top: 18px; }

.q-move { display: flex; gap: 8px; margin-top: 30px; }

/* 채점표 */
.score-n {
  font-family: 'Nanum Myeongjo', serif; font-size: clamp(54px, 13vw, 104px); font-weight: 800;
  letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums;
  display: inline-block; padding-bottom: 8px; border-bottom: 2px solid var(--seal);
}
.score-n small { font-size: 0.26em; font-weight: 400; color: var(--ink-2); margin-left: 8px; letter-spacing: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 24px; }
.chip {
  border: 1px solid var(--rule); background: transparent; color: var(--ink-2);
  font: inherit; font-size: 13px; padding: 5px 12px; cursor: pointer;
  font-variant-numeric: tabular-nums; transition: color 0.2s, border-color 0.2s;
}
.chip:hover { color: var(--ink); border-color: var(--ink); }

/* 알림 쪽지 */
#toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 14px);
  background: var(--ink); color: var(--paper); font-size: 13.5px;
  padding: 9px 20px; opacity: 0; pointer-events: none; z-index: 60;
  transition: opacity 0.24s, transform 0.24s;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }

:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
</style>
</head>

<body data-mode="home">

<header class="head" id="head">
  <a class="head-l" id="head-left" href="index.html?go=dashboard">
    <span class="head-t" id="head-title">양진웅 기출 노트</span>
    <span class="mark" id="mark" title="동기화 상태"></span>
  </a>
  <div class="head-r" id="head-right">
    <span id="stamp"></span>
    <button class="hbtn" id="theme" type="button">지면</button>
    <a class="hbtn hbtn-wide" href="index.html?go=dashboard">기존 홈</a>
  </div>
  <div class="gaugebar" id="gaugebar"><i></i></div>
</header>

<!-- ══════════════ 홈 ══════════════ -->
<main id="deck">
  <section class="leaf" id="l-open">
    <div class="col">
      <p class="tag" data-in style="--i:0" id="open-date"></p>
      <h1 data-in style="--i:1" id="open-line">불러오는 중</h1>
      <p class="body" data-in style="--i:2" id="open-body">저장해 둔 기록을 펼치고 있습니다.</p>
      <div class="acts" data-in style="--i:3" id="open-acts"></div>
    </div>
    <button class="turn" type="button" data-next="#l-day"><span>다음 장</span><span>↓</span></button>
  </section>

  <section class="leaf" id="l-day">
    <div class="col">
      <p class="tag" data-in style="--i:0">시험까지 남은 일정</p>
      <div id="day-body"></div>
    </div>
    <button class="turn" type="button" data-next="#l-resume"><span>다음 장</span><span>↓</span></button>
  </section>

  <section class="leaf" id="l-resume">
    <div class="col">
      <p class="tag" data-in style="--i:0">읽던 자리</p>
      <div id="resume-body"></div>
    </div>
    <button class="turn" type="button" data-next="#l-progress"><span>다음 장</span><span>↓</span></button>
  </section>

  <section class="leaf" id="l-progress">
    <div class="col">
      <p class="tag" data-in style="--i:0">지금까지의 기록</p>
      <h2 data-in style="--i:1">어디까지 왔는지</h2>
      <div id="progress-body"></div>
    </div>
    <button class="turn" type="button" data-next="#l-review"><span>다음 장</span><span>↓</span></button>
  </section>

  <section class="leaf" id="l-review">
    <div class="col">
      <p class="tag" data-in style="--i:0">다시 볼 것들</p>
      <h2 data-in style="--i:1">틀린 자리로 돌아가기</h2>
      <nav class="toc" data-in style="--i:2">
        <a href="index.html?go=wrong">
          <span class="toc-t">오답 노트<span class="toc-s">한 번 틀린 문제</span></span>
          <span class="toc-d"></span><span class="toc-n" id="n-wrong">—</span>
        </a>
        <a href="index.html?go=star">
          <span class="toc-t">별표<span class="toc-s">표시해 둔 문제</span></span>
          <span class="toc-d"></span><span class="toc-n" id="n-star">—</span>
        </a>
        <a href="index.html?go=mock">
          <span class="toc-t">모의고사<span class="toc-s">시간을 재고 푼 기록</span></span>
          <span class="toc-d"></span><span class="toc-n" id="n-mock">—</span>
        </a>
      </nav>
    </div>
    <button class="turn" type="button" data-next="#l-start"><span>다음 장</span><span>↓</span></button>
  </section>

  <section class="leaf" id="l-start">
    <div class="col">
      <p class="tag" data-in style="--i:0">펼치기</p>
      <h2 data-in style="--i:1" id="start-line">어느 것을 펼칠까요</h2>
      <div id="start-body"></div>
      <div class="seal" data-in style="--i:5">양진웅</div>
    </div>
  </section>
</main>

<!-- ══════════════ 회차 고르기 ══════════════ -->
<section class="view" id="rounds">
  <div class="pick-h">
    <p class="tag">회차 고르기</p>
    <h2 id="pick-title">—</h2>
    <p class="body" id="pick-sub"></p>
  </div>
  <div class="pick-list"><nav class="toc" id="pick-list"></nav></div>
  <div class="acts"><button class="go go-2" type="button" id="pick-back">홈으로</button></div>
</section>

<!-- ══════════════ 시험지 ══════════════ -->
<section class="view" id="paper"></section>

<footer class="foot">
  <span>기존 앱과 같은 기록입니다 · 여기서 푼 것도 그대로 쌓입니다</span>
  <a href="index.html?go=dashboard">기존 홈으로</a>
</footer>

<div id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   저장소 — index.html 과 같은 키·형식·판 번호 규약
   ══════════════════════════════════════════════════════════════ */
const KEYS = ['quiz_data','quiz_progress','quiz_wrong','quiz_starred','quiz_categories',
              'cal_data','resume_bookmark','quiz_mastery','mock_records','quiz_daily','quiz_srs'];

const get = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (_) { return d; } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };
const ts  = k => parseInt(localStorage.getItem(k + '_ts')  || '0');
const rev = k => parseInt(localStorage.getItem(k + '_rev') || '0');

const getData     = () => get('quiz_data', {});
const getProgress = () => get('quiz_progress', {});
const getWrongs   = () => get('quiz_wrong', []);
const getStarred  = () => get('quiz_starred', {});
const getCats     = () => get('quiz_categories', []);
const getCal      = () => get('cal_data', {});
const getBookmark = () => get('resume_bookmark', null);
const getMastery  = () => get('quiz_mastery', {});
const getMocks    = () => get('mock_records', []);
const getDaily    = () => get('quiz_daily', {});
const getSrs      = () => get('quiz_srs', {});

/* 서버에 쓰기 — index.html 의 syncToFirebase 와 같은 규약(판 번호 +1) */
function push(key, value) {
  const t = Date.now(), r = rev(key) + 1;
  put(key, value);
  try { localStorage.setItem(key + '_ts', String(t)); localStorage.setItem(key + '_rev', String(r)); } catch (_) {}
  if (!FIREBASE_OK) return;
  mark('busy');
  db.collection('users').doc(USER_ID).collection('data').doc(key)
    .set({ value, updatedAt: t, rev: r })
    .then(() => mark('ok'))
    .catch(() => mark('off'));
}
/* 연달아 답할 때 서버 쓰기가 몰리지 않게 잠깐 모았다 보낸다 */
const _pending = {};
function pushSoon(key, value, ms) {
  put(key, value);
  clearTimeout(_pending[key]);
  _pending[key] = setTimeout(() => { delete _pending[key]; push(key, value); }, ms || 700);
  _pendingVal[key] = value;
}
const _pendingVal = {};
function flushPending() {
  Object.keys(_pending).forEach(k => {
    clearTimeout(_pending[k]); delete _pending[k];
    if (_pendingVal[k] !== undefined) { push(k, _pendingVal[k]); delete _pendingVal[k]; }
  });
}
addEventListener('pagehide', flushPending);
addEventListener('beforeunload', flushPending);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushPending(); });

/* ══════════════════════════════════════════════════════════════
   동기화 — 서버가 더 새로울 때만 받는다
   ══════════════════════════════════════════════════════════════ */
let pulling = false;
function mark(state) {
  const m = document.getElementById('mark');
  m.className = 'mark ' + state;
  m.title = state === 'ok' ? '최신 기록' : state === 'busy' ? '주고받는 중' : '연결 없음 — 이 기기에만 저장';
}
function stampTime() {
  const t = new Date();
  const el = document.getElementById('stamp');
  if (el) el.textContent = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')} 기준`;
}
function takeRemote(key, r) {
  if (!r) return false;
  if (_pending[key]) return false;   // 아직 못 보낸 내 변경이 있으면 덮어쓰지 않는다
  const rTs = r.updatedAt || 0, rRev = r.rev || 0;
  if (rRev > rev(key) || (rRev === rev(key) && rTs > ts(key))) {
    put(key, r.value);
    try { localStorage.setItem(key + '_ts', String(rTs)); localStorage.setItem(key + '_rev', String(rRev)); } catch (_) {}
    return true;
  }
  return false;
}
async function pull() {
  if (!FIREBASE_OK || pulling) return;
  pulling = true; mark('busy');
  try {
    await Promise.all(KEYS.map(async key => {
      const snap = await db.collection('users').doc(USER_ID).collection('data').doc(key).get();
      if (snap.exists) takeRemote(key, snap.data());
    }));
    mark('ok'); stampTime();
  } catch (e) { console.warn('받아오기 실패', e); mark('off'); }
  finally { pulling = false; if (mode === 'home') draw(); }
}
let watching = false;
function watch() {
  if (!FIREBASE_OK || watching) return;
  watching = true;
  KEYS.forEach(key => {
    db.collection('users').doc(USER_ID).collection('data').doc(key).onSnapshot(
      snap => { if (snap.exists && takeRemote(key, snap.data())) { stampTime(); soon(); } mark('ok'); },
      () => mark('off')
    );
  });
}
let drawTimer = null;
const soon = () => {
  clearTimeout(drawTimer);
  drawTimer = setTimeout(() => { if (mode === 'home') draw(); }, 180);
};
addEventListener('storage', e => { if (e.key && KEYS.includes(e.key)) soon(); });
addEventListener('online', pull);
addEventListener('pageshow', e => { if (e.persisted) pull(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });

/* ══════════════════════════════════════════════════════════════
   도움 함수
   ══════════════════════════════════════════════════════════════ */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const CIRCLE = ['①','②','③','④','⑤','⑥','⑦','⑧'];
const dday = at => {
  const mid = ms => { const d = new Date(ms); d.setHours(0,0,0,0); return d.getTime(); };
  return Math.round((mid(at) - mid(Date.now())) / 86400000);
};
function sortRounds(arr) {
  return arr.slice().sort((a, b) => {
    const pa = String(a).split('-'), pb = String(b).split('-');
    if (pa.length > 1 || pb.length > 1) {
      const ya = pa.length > 1 ? pa[0] : '', yb = pb.length > 1 ? pb[0] : '';
      if (ya !== yb) return String(ya).localeCompare(String(yb));
      return (parseFloat(pa[pa.length-1]) || 0) - (parseFloat(pb[pb.length-1]) || 0);
    }
    return (parseFloat(a) || 0) - (parseFloat(b) || 0) || String(a).localeCompare(String(b));
  });
}
function mainEvent() {
  const d = getCal();
  let list = Array.isArray(d.events) ? d.events.slice() : [];
  if (!list.length && d.examDate) list = [{ name: '시험', at: new Date(d.examDate + 'T09:00:00').getTime(), main: true }];
  list.sort((a, b) => a.at - b.at);
  return list.find(e => e.main) || list[0] || null;
}
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 1800);
}

/* 그림 — 기존 앱과 같은 저장소(IndexedDB yjnote-img)에서 읽는다 */
let _imgDbP = null;
function imgDB() {
  if (_imgDbP) return _imgDbP;
  _imgDbP = new Promise((res, rej) => {
    if (!window.indexedDB) { rej(new Error('no idb')); return; }
    const rq = indexedDB.open('yjnote-img', 1);
    rq.onupgradeneeded = () => { const d = rq.result; if (!d.objectStoreNames.contains('imgs')) d.createObjectStore('imgs'); };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
  return _imgDbP;
}
async function loadImg(id) {
  try {
    const d = await imgDB();
    const v = await new Promise((res, rej) => {
      const tx = d.transaction('imgs', 'readonly'); const st = tx.objectStore('imgs');
      const r = st.get(id); r.onsuccess = () => res(r.result); tx.onerror = () => rej(tx.error);
    });
    if (v) return v;
  } catch (_) {}
  if (!FIREBASE_OK) return null;
  try {
    const snap = await db.collection('users').doc(USER_ID).collection('data').doc('quiz_img_' + id).get();
    return snap.exists ? (snap.data().value || null) : null;
  } catch (_) { return null; }
}
function fillFigures(root) {
  (root || document).querySelectorAll('.q-fig[data-img]:not([data-done])').forEach(async box => {
    box.dataset.done = '1';
    const src = await loadImg(box.dataset.img);
    box.innerHTML = src ? `<img src="${src}" alt="문제 그림">` : `<span class="loading">그림을 불러오지 못했습니다</span>`;
  });
}

/* ══════════════════════════════════════════════════════════════
   홈 그리기
   ══════════════════════════════════════════════════════════════ */
let tick = null;

function draw() {
  const data = getData(), prog = getProgress(), mst = getMastery();
  const cats = getCats().filter(c => Object.keys(data[c] || {}).length);
  const wrongN = getWrongs().length;
  const starN  = Object.keys(getStarred()).length;
  const mockN  = getMocks().length;
  const bm = getBookmark();
  const ev = mainEvent();

  /* 표지 */
  const now = new Date(), hh = now.getHours();
  const when = hh < 5 ? '깊은 밤에' : hh < 12 ? '아침에' : hh < 18 ? '낮에' : '저녁에';
  document.getElementById('open-date').textContent =
    `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 ${'일월화수목금토'[now.getDay()]}요일, ${when}`;

  let line, body;
  if (bm) {
    line = `${esc(bm.cat)} ${esc(bm.round)}회차,<br>${esc(bm.qNum)}번에 접어둔 자리가 있습니다.`;
    body = wrongN ? `오답 노트에는 <strong>${wrongN}문항</strong>이 남아 있습니다.`
                  : `틀린 문제 없이 여기까지 왔습니다.`;
  } else if (cats.length) {
    line = `오늘도 한 회차만<br>끝내보기로 합니다.`;
    body = wrongN ? `틀렸던 <strong>${wrongN}문항</strong>도 기다리고 있습니다.`
                  : `회차를 고르면 마지막으로 멈춘 자리에서 이어집니다.`;
  } else {
    line = `아직 펼칠 문제가<br>없습니다.`;
    body = `기존 앱에서 자격증과 회차를 넣으면 이 지면이 채워집니다.`;
  }
  document.getElementById('open-line').innerHTML = line;
  document.getElementById('open-body').innerHTML = body;
  document.getElementById('open-acts').innerHTML = bm
    ? `<button class="go" type="button" onclick="resumeBookmark()">이어서 풀기</button>
       <button class="go go-2" type="button" onclick="gotoStart()">다른 회차 고르기</button>`
    : `<button class="go" type="button" onclick="gotoStart()">회차 고르기</button>
       <a class="go go-2" href="index.html?go=review">복습 노트</a>`;

  /* 시험일 */
  const dayBox = document.getElementById('day-body');
  if (ev) {
    const d = dday(ev.at), at = new Date(ev.at);
    const label = d === 0 ? '오늘' : d > 0 ? `D-${d}` : `D+${Math.abs(d)}`;
    dayBox.innerHTML = `
      <h2 data-in style="--i:1">${esc(ev.name)}</h2>
      <div class="count" data-in style="--i:2">${label}${d > 0 ? '<small>남았습니다</small>' : ''}</div>
      <div class="lines" data-in style="--i:3">
        <div class="line"><span class="line-k">일시</span><span class="line-v">${at.getFullYear()}. ${pad(at.getMonth()+1)}. ${pad(at.getDate())} ${pad(at.getHours())}:${pad(at.getMinutes())}</span></div>
        <div class="line"><span class="line-k">남은 시간</span><span class="line-v" id="left">—</span></div>
      </div>
      <div class="acts" data-in style="--i:4"><a class="go go-2" href="index.html?go=calendar">일정 고치기</a></div>`;
    if (tick) clearInterval(tick);
    const run = () => {
      const el = document.getElementById('left');
      if (!el) { clearInterval(tick); return; }
      let ms = ev.at - Date.now(); const past = ms < 0; ms = Math.abs(ms);
      el.textContent = `${Math.floor(ms/86400000)}일 ${pad(Math.floor(ms/3600000)%24)}:${pad(Math.floor(ms/60000)%60)}:${pad(Math.floor(ms/1000)%60)}` + (past ? ' 지남' : '');
    };
    run(); tick = setInterval(run, 1000);
  } else {
    dayBox.innerHTML = `
      <h2 data-in style="--i:1">시험 날짜를 아직<br>적어두지 않았습니다</h2>
      <div class="note" data-in style="--i:2"><b>날짜를 넣으면</b>남은 날이 이 자리에 크게 적히고, 남은 시간이 초 단위로 흐릅니다.</div>
      <div class="acts" data-in style="--i:3"><a class="go" href="index.html?go=calendar">시험 날짜 적기</a></div>`;
  }

  /* 읽던 자리 */
  const rBox = document.getElementById('resume-body');
  rBox.innerHTML = bm ? `
      <h2 data-in style="--i:1">${esc(bm.cat)} ${esc(bm.round)}회차</h2>
      <p class="body" data-in style="--i:2">${esc(bm.qNum)}번 문항에 표시를 남겨두었습니다. 그 자리에서 바로 펼칩니다.</p>
      <div class="acts" data-in style="--i:3">
        <button class="go" type="button" onclick="resumeBookmark()">이어서 풀기</button>
        <button class="go go-2" type="button" onclick="gotoStart()">다른 회차 고르기</button>
      </div>` : `
      <h2 data-in style="--i:1">접어둔 자리가 없습니다</h2>
      <div class="note" data-in style="--i:2"><b>자리를 접어두는 법</b>문제를 풀다가 '여기 접기'를 누르면 그 문항이 이 지면에 올라옵니다.</div>
      <div class="acts" data-in style="--i:3"><button class="go" type="button" onclick="gotoStart()">회차 고르기</button></div>`;

  /* 진도 */
  const pBox = document.getElementById('progress-body');
  if (cats.length) {
    const rows = cats.map(cat => {
      const rounds = Object.keys(data[cat] || {});
      let total = 0, done = 0, msum = 0;
      rounds.forEach(r => {
        total += (data[cat][r] || []).length;
        done  += Object.keys((prog[cat + '_' + r] || {}).answered || {}).length;
        msum  += (mst[cat + '||' + r] || 0);
      });
      return { cat, rounds: rounds.length, total, done,
               pct: total ? Math.round(done / total * 100) : 0,
               avg: rounds.length ? Math.round(msum / rounds.length) : 0 };
    }).sort((a, b) => b.pct - a.pct);
    pBox.innerHTML = `<div class="sheet" data-in style="--i:2">${rows.map(r => `
        <div class="trow">
          <div class="trow-h"><span class="trow-n">${esc(r.cat)}</span><span class="trow-p">${r.pct}%</span></div>
          <div class="trow-s">${r.rounds}회차 · ${r.done}/${r.total}문항 · 암기도 ${r.avg}%</div>
          <div class="gauge"><i data-w="${r.pct}"></i></div>
        </div>`).join('')}</div>`;
  } else {
    pBox.innerHTML = `<div class="note" data-in style="--i:2"><b>아직 적힌 기록이 없습니다</b>기존 앱에서 자격증과 회차를 넣으면 이 표에 쌓입니다.</div>`;
  }

  /* 복습 */
  document.getElementById('n-wrong').textContent = wrongN + '문항';
  document.getElementById('n-star').textContent  = starN + '문항';
  document.getElementById('n-mock').textContent  = mockN + '회';

  /* 펼치기 */
  const sBox = document.getElementById('start-body');
  document.getElementById('start-line').textContent = cats.length ? '어느 것을 펼칠까요' : '문제를 넣는 것부터';
  sBox.innerHTML = cats.length ? `
      <nav class="toc" data-in style="--i:2">
        ${cats.map(cat => {
          const rounds = Object.keys(data[cat] || {});
          const n = rounds.reduce((s, r) => s + (data[cat][r] || []).length, 0);
          let done = 0;
          rounds.forEach(r => { done += Object.keys((prog[cat + '_' + r] || {}).answered || {}).length; });
          return `<button type="button" data-cat="${esc(cat)}">
              <span class="toc-t">${esc(cat)}<span class="toc-s">${rounds.length}회차 · ${n}문항</span></span>
              <span class="toc-d"></span><span class="toc-n">${n ? Math.round(done/n*100) : 0}%</span>
            </button>`;
        }).join('')}
      </nav>
      <div class="acts" data-in style="--i:3">
        <a class="go go-2" href="index.html?go=memo-tab">암기 메모</a>
        <a class="go go-2" href="index.html?go=settings">설정</a>
      </div>` : `
      <div class="note" data-in style="--i:2"><b>비어 있는 지면</b>기존 앱의 설정에서 자격증을 더하면 이 자리에 목록이 적힙니다.</div>
      <div class="acts" data-in style="--i:3"><a class="go" href="index.html?go=settings">기존 앱 설정 열기</a></div>`;

  reveal();
}

function gotoStart() {
  document.getElementById('l-start').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ══════════════════════════════════════════════════════════════
   지면 전환
   ══════════════════════════════════════════════════════════════ */
let mode = 'home';
let pick = { cat: null };
let quiz = null;   // { cat, round, qs, answered, subj, shown }

function setMode(m) {
  mode = m;
  document.body.dataset.mode = m;
  const gauge = document.getElementById('gaugebar');
  gauge.style.display = (m === 'solve') ? 'block' : 'none';
  const right = document.getElementById('head-right');
  const title = document.getElementById('head-title');
  if (m === 'home') {
    title.textContent = '양진웅 기출 노트';
    right.innerHTML = `<span id="stamp"></span>
      <button class="hbtn" id="theme" type="button">지면</button>
      <a class="hbtn hbtn-wide" href="index.html?go=dashboard">기존 홈</a>`;
    stampTime(); bindTheme();
  } else if (m === 'rounds') {
    title.textContent = pick.cat || '회차 고르기';
    right.innerHTML = `<button class="hbtn" type="button" onclick="goHome()">홈</button>`;
  } else {
    title.textContent = `${quiz.cat} ${quiz.round}회차`;
    right.innerHTML = `<span id="qcount"></span><button class="hbtn" type="button" onclick="leaveQuiz()">덮기</button>`;
  }
  scrollTo(0, 0);
}
function goHome() {
  flushPending();
  setMode('home');
  history.replaceState({ v: 'home' }, '');
  draw();
}

/* ── 회차 고르기 ── */
function openRounds(cat, quiet) {
  pick.cat = cat;
  const data = getData(), prog = getProgress(), mst = getMastery();
  const rounds = sortRounds(Object.keys(data[cat] || {}));
  const total = rounds.reduce((s, r) => s + (data[cat][r] || []).length, 0);

  document.getElementById('pick-title').textContent = cat;
  document.getElementById('pick-sub').textContent = `${rounds.length}회차 · 모두 ${total}문항`;
  document.getElementById('pick-list').innerHTML = rounds.length ? rounds.map(r => {
    const qs = data[cat][r] || [];
    const p = prog[cat + '_' + r] || {};
    const done = Object.keys(p.answered || {}).length;
    const pct = qs.length ? Math.round(done / qs.length * 100) : 0;
    const m = mst[cat + '||' + r] || 0;
    const state = done === 0 ? '아직 펼치지 않음' : done >= qs.length ? '끝까지 풀었음' : `${done}문항까지 풀었음`;
    return `<button type="button" data-cat="${esc(cat)}" data-round="${esc(r)}">
        <span class="toc-t">${esc(r)}회차<span class="toc-s">${qs.length}문항 · ${state}${m ? ` · 암기도 ${m}%` : ''}</span></span>
        <span class="toc-d"></span><span class="toc-n">${pct}%</span>
      </button>`;
  }).join('') : `<div class="note"><b>회차가 없습니다</b>기존 앱에서 회차를 먼저 넣어주세요.</div>`;

  setMode('rounds');
  if (!quiet) history.pushState({ v: 'rounds', cat }, '');
}
document.getElementById('pick-back').addEventListener('click', goHome);

// 자격증·회차 단추 (홈의 '펼치기' 목록과 회차 목록 공용)
document.addEventListener('click', e => {
  const b = e.target.closest('button[data-cat]');
  if (!b) return;
  if (b.dataset.round !== undefined) openRound(b.dataset.cat, b.dataset.round);
  else openRounds(b.dataset.cat);
});

/* ══════════════════════════════════════════════════════════════
   시험지
   ══════════════════════════════════════════════════════════════ */
function openRound(cat, round, startIdx) {
  const data = getData();
  const qs = (data[cat] && data[cat][round]) ? data[cat][round].slice() : [];
  if (!qs.length) { toast('문항이 없습니다'); return; }

  pick.cat = cat;
  const prog = getProgress()[cat + '_' + round] || {};
  quiz = { cat, round, qs, answered: { ...(prog.answered || {}) }, subj: {}, reveal: {} };

  document.getElementById('paper').innerHTML =
    qs.map((q, i) => qLeaf(q, i)).join('') + scoreLeaf();

  setMode('solve');
  history.pushState({ v: 'solve', cat, round }, '');

  paintAll();
  fillFigures(document.getElementById('paper'));
  observePaper();

  const at = (startIdx != null) ? startIdx : (prog.idx || 0);
  if (at > 0) {
    const el = document.getElementById('q' + at);
    if (el) setTimeout(() => el.scrollIntoView({ behavior: 'auto', block: 'start' }), 30);
  }
}

function resumeBookmark() {
  const bm = getBookmark();
  if (!bm) { toast('접어둔 자리가 없습니다'); return; }
  const data = getData();
  if (!(data[bm.cat] && data[bm.cat][bm.round])) { toast('그 회차를 찾지 못했습니다'); return; }
  openRound(bm.cat, bm.round, bm.qIndex || 0);
}

function leaveQuiz() {
  flushPending();
  if (pick.cat) openRounds(pick.cat); else goHome();
}

function qLeaf(q, i) {
  const isSubj = q.type === 'subj';
  const no = q.num != null ? q.num : (i + 1);
  return `
  <article class="q-leaf" id="q${i}" data-i="${i}">
    <div class="q-col">
      <div class="q-top">
        <span class="q-no">${esc(String(no))}<small>${isSubj ? '필답' : '객관'}</small></span>
        <span class="q-tools">
          <button class="qt" type="button" data-star="${i}">☆ 표시</button>
          <button class="qt" type="button" data-fold="${i}">여기 접기</button>
        </span>
      </div>
      <p class="q-ask">${esc(q.question || '')}</p>
      ${q.imgId ? `<div class="q-fig" data-img="${esc(q.imgId)}"><span class="loading">그림을 불러오는 중…</span></div>` : ''}
      ${isSubj ? subjBody(q, i) : `<ul class="opts" id="opts${i}">${(q.options || []).map((o, k) => `
        <li><button class="opt" type="button" data-pick="${i}" data-k="${k}">
          <span class="opt-n">${CIRCLE[k] || (k+1)}</span>
          <span class="opt-t">${esc(o)}</span>
          <span class="opt-m"></span>
        </button></li>`).join('')}</ul>`}
      <div class="q-verdict" id="v${i}" hidden></div>
      ${q.explanation ? `<div class="why" id="w${i}" hidden><span class="why-k">해 설</span>${esc(q.explanation)}</div>` : ''}
      ${q.expImgId ? `<div class="q-fig" data-img="${esc(q.expImgId)}" id="wi${i}" hidden><span class="loading">그림을 불러오는 중…</span></div>` : ''}
      <div class="q-move">
        ${i > 0 ? `<button class="go go-2" type="button" data-jump="${i-1}">앞 문항</button>` : ''}
        <button class="go go-2" type="button" data-jump="${i+1}">${i === (quiz ? quiz.qs.length - 1 : 0) ? '채점표' : '다음 문항'}</button>
      </div>
    </div>
  </article>`;
}

function subjBody(q, i) {
  return `
    <textarea class="write" data-write="${i}" spellcheck="false" placeholder="여기에 답을 적어보세요"></textarea>
    <div class="model" id="m${i}" hidden>
      <div class="why"><span class="why-k">모범 답안</span>${esc(q.answer || '')}</div>
    </div>
    <div class="subj-acts">
      <button class="go go-2" type="button" data-show="${i}">정답 보기</button>
      <button class="go go-2" type="button" data-judge="${i}" data-r="correct">○ 맞음</button>
      <button class="go go-2" type="button" data-judge="${i}" data-r="wrong">✕ 틀림</button>
    </div>`;
}

function scoreLeaf() {
  return `
  <article class="q-leaf" id="qend">
    <div class="q-col">
      <p class="tag">채점표</p>
      <h2 id="sc-line">여기까지</h2>
      <div class="score-n" id="sc-num">—</div>
      <div class="lines">
        <div class="line"><span class="line-k">푼 문항</span><span class="line-v" id="sc-done">—</span></div>
        <div class="line"><span class="line-k">맞은 문항</span><span class="line-v" id="sc-ok">—</span></div>
        <div class="line"><span class="line-k">틀린 문항</span><span class="line-v" id="sc-no">—</span></div>
      </div>
      <div id="sc-list"></div>
      <div class="acts">
        <button class="go" type="button" onclick="leaveQuiz()">회차 목록으로</button>
        <button class="go go-2" type="button" onclick="goHome()">홈으로</button>
      </div>
    </div>
  </article>`;
}

/* ── 표시 갱신 ── */
function paintAll() {
  quiz.qs.forEach((q, i) => paintOne(i));
  paintScore();
  paintCount();
}

function paintOne(i) {
  const q = quiz.qs[i];
  const a = quiz.answered[i];
  const leaf = document.getElementById('q' + i);
  if (!leaf) return;

  // 별표
  const stars = getStarred();
  const sKey = quiz.cat + '||' + quiz.round + '||' + (q.id || q.num || i);
  const sBtn = leaf.querySelector('[data-star]');
  if (sBtn) {
    const on = !!stars[sKey];
    sBtn.textContent = on ? '★ 표시됨' : '☆ 표시';
    sBtn.classList.toggle('on', on);
  }

  const v = document.getElementById('v' + i);
  const w = document.getElementById('w' + i);
  const wi = document.getElementById('wi' + i);

  if (q.type === 'subj') {
    const t = leaf.querySelector('[data-write]');
    if (t && quiz.subj[i] != null && t.value !== quiz.subj[i]) t.value = quiz.subj[i];
    const m = document.getElementById('m' + i);
    const shown = !!quiz.reveal[i];
    if (m) m.hidden = !shown;
    const showBtn = leaf.querySelector('[data-show]');
    if (showBtn) showBtn.textContent = shown ? '정답 숨기기' : '정답 보기';
    leaf.querySelectorAll('[data-judge]').forEach(b => b.classList.toggle('on', a === b.dataset.r));
    if (a) {
      v.hidden = false;
      v.innerHTML = a === 'correct' ? `<b>○</b> 맞았다고 표시했습니다` : `<b>✕</b> 틀렸다고 표시했습니다`;
      if (w) w.hidden = false;
      if (wi) { wi.hidden = false; fillFigures(leaf); }
    } else { v.hidden = true; }
    return;
  }

  const done = (a !== undefined);
  leaf.querySelectorAll('.opt').forEach((b, k) => {
    b.disabled = done;
    b.classList.toggle('is-answer', done && k === q.correct);
    b.classList.toggle('picked-bad', done && k === a && a !== q.correct);
  });
  if (done) {
    const ok = a === q.correct;
    v.hidden = false;
    v.innerHTML = ok
      ? `<b>○</b> 맞았습니다`
      : `<b>✕</b> 정답은 ${CIRCLE[q.correct] || (q.correct + 1)}번입니다`;
    if (w) w.hidden = false;
    if (wi) { wi.hidden = false; fillFigures(leaf); }
  } else {
    v.hidden = true;
    if (w) w.hidden = true;
    if (wi) wi.hidden = true;
  }
}

function paintScore() {
  const total = quiz.qs.length;
  let done = 0, ok = 0, bad = [];
  quiz.qs.forEach((q, i) => {
    const a = quiz.answered[i];
    if (a === undefined) return;
    done++;
    const right = q.type === 'subj' ? (a === 'correct') : (a === q.correct);
    if (right) ok++; else bad.push(i);
  });
  const el = id => document.getElementById(id);
  if (!el('sc-num')) return;
  el('sc-num').innerHTML = done ? `${Math.round(ok / done * 100)}<small>%</small>` : `—`;
  el('sc-done').textContent = `${done} / ${total}문항`;
  el('sc-ok').textContent = `${ok}문항`;
  el('sc-no').textContent = `${bad.length}문항`;
  el('sc-line').textContent = done === 0 ? '아직 푼 문항이 없습니다'
    : bad.length === 0 ? '모두 맞았습니다' : '틀린 자리를 다시 봅니다';
  el('sc-list').innerHTML = bad.length
    ? `<div class="chips">${bad.map(i => {
        const n = quiz.qs[i].num != null ? quiz.qs[i].num : (i + 1);
        return `<button class="chip" type="button" data-jump="${i}">${esc(String(n))}번</button>`;
      }).join('')}</div>`
    : '';
}

function paintCount() {
  const done = Object.keys(quiz.answered).length;
  const total = quiz.qs.length;
  const c = document.getElementById('qcount');
  if (c) c.textContent = `${done} / ${total}`;
  const g = document.querySelector('#gaugebar i');
  if (g) g.style.width = (total ? done / total * 100 : 0) + '%';
}

/* ── 저장 ── */
function saveProgressNow(idx) {
  const p = getProgress();
  p[quiz.cat + '_' + quiz.round] = { answered: { ...quiz.answered }, at: Date.now(), idx: idx || 0 };
  pushSoon('quiz_progress', p);
}
function bumpDaily() {
  const s = getDaily();
  const t = new Date();
  const k = `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
  s[k] = (s[k] || 0) + 1;
  pushSoon('quiz_daily', s, 1500);
}
const SRS_STEPS = [1, 3, 7, 14, 30, 60];
function srsGrade(q, i, right) {
  const all = getSrs();
  const qid = (q && (q.id != null ? q.id : q.num));
  const key = `${quiz.cat}||${quiz.round}||${qid != null && qid !== '' ? qid : 'i' + i}`;
  const cur = all[key] || { lv: 0 };
  const lv = right ? Math.min((cur.lv || 0) + 1, SRS_STEPS.length - 1) : 0;
  const d = new Date(); d.setHours(0,0,0,0);
  all[key] = { lv, due: d.getTime() + SRS_STEPS[lv] * 86400000, last: Date.now(),
               cat: quiz.cat, round: quiz.round, num: q.num != null ? q.num : (i + 1) };
  pushSoon('quiz_srs', all, 1500);
}
function markWrong(q, i, right, myAnswer) {
  let w = getWrongs();
  const id = quiz.cat + '_' + quiz.round + '_' + (q.id || q.num);
  w = w.filter(x => x.id !== id);
  if (!right) w.push({ id, cat: quiz.cat, round: quiz.round, q, myAnswer, addedAt: Date.now() });
  pushSoon('quiz_wrong', w, 900);
}

function answer(i, k) {
  const q = quiz.qs[i];
  if (quiz.answered[i] !== undefined) return;
  quiz.answered[i] = k;
  const right = (k === q.correct);
  paintOne(i); paintScore(); paintCount();
  saveProgressNow(i);
  markWrong(q, i, right, k);
  srsGrade(q, i, right);
  bumpDaily();
}
function judge(i, r) {
  const q = quiz.qs[i];
  const first = quiz.answered[i] === undefined;
  quiz.answered[i] = r;
  paintOne(i); paintScore(); paintCount();
  saveProgressNow(i);
  markWrong(q, i, r === 'correct', -1);
  srsGrade(q, i, r === 'correct');
  if (first) bumpDaily();
}
function toggleStar(i) {
  const q = quiz.qs[i];
  const s = getStarred();
  const key = quiz.cat + '||' + quiz.round + '||' + (q.id || q.num || i);
  if (s[key]) { delete s[key]; toast('표시를 지웠습니다'); }
  else { s[key] = { cat: quiz.cat, round: quiz.round, q, addedAt: Date.now() }; toast('표시했습니다'); }
  pushSoon('quiz_starred', s, 400);
  paintOne(i);
}
function fold(i) {
  const q = quiz.qs[i];
  push('resume_bookmark', {
    cat: quiz.cat, round: quiz.round, qIndex: i,
    qNum: q.num != null ? q.num : (i + 1), savedAt: Date.now()
  });
  toast(`${q.num != null ? q.num : i + 1}번에 자리를 접었습니다`);
}

/* ── 시험지 조작 ── */
document.getElementById('paper').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || !quiz) return;
  if (b.dataset.pick !== undefined) { answer(+b.dataset.pick, +b.dataset.k); return; }
  if (b.dataset.judge !== undefined) { judge(+b.dataset.judge, b.dataset.r); return; }
  if (b.dataset.show !== undefined) {
    const i = +b.dataset.show; quiz.reveal[i] = !quiz.reveal[i]; paintOne(i); return;
  }
  if (b.dataset.star !== undefined) { toggleStar(+b.dataset.star); return; }
  if (b.dataset.fold !== undefined) { fold(+b.dataset.fold); return; }
  if (b.dataset.jump !== undefined) {
    const i = +b.dataset.jump;
    const el = document.getElementById(i >= quiz.qs.length ? 'qend' : 'q' + i);
    el?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
});
document.getElementById('paper').addEventListener('input', e => {
  const t = e.target.closest('[data-write]');
  if (t && quiz) quiz.subj[+t.dataset.write] = t.value;
});

/* 스크롤에 따라 진행 눈금과 '보던 자리' 갱신 */
let paperIO = null, lastSeen = -1, seenTimer = null;
function observePaper() {
  if (paperIO) paperIO.disconnect();
  paperIO = new IntersectionObserver(es => {
    es.forEach(e => {
      if (!e.isIntersecting || e.intersectionRatio < 0.5) return;
      const i = e.target.dataset.i;
      if (i === undefined) return;
      lastSeen = +i;
      clearTimeout(seenTimer);
      seenTimer = setTimeout(() => { if (quiz) saveProgressNow(lastSeen); }, 1200);
    });
  }, { threshold: 0.5 });
  document.querySelectorAll('#paper .q-leaf[data-i]').forEach(l => paperIO.observe(l));
}

/* ══════════════════════════════════════════════════════════════
   홈 장 넘김
   ══════════════════════════════════════════════════════════════ */
let io = null;
function reveal() {
  const leaves = [...document.querySelectorAll('#deck .leaf')];
  if (io) io.disconnect();
  io = new IntersectionObserver(es => {
    es.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.classList.add('on');
      e.target.querySelectorAll('.gauge i').forEach(g => { g.style.width = (g.dataset.w || 0) + '%'; });
    });
  }, { threshold: 0.18 });
  leaves.forEach(l => io.observe(l));
  if (leaves[0]) leaves[0].classList.add('on');
}
document.addEventListener('click', e => {
  const t = e.target.closest('.turn');
  if (t) document.querySelector(t.dataset.next)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

/* 뒤로 가기 */
addEventListener('popstate', e => {
  const v = (e.state && e.state.v) || 'home';
  if (v === 'home') goHome();
  else if (v === 'rounds' && e.state.cat) openRounds(e.state.cat, true);
  else goHome();
});

/* 지면 밝기 — 기존 앱의 darkMode 값을 공유 */
function paintTheme() {
  const saved = localStorage.getItem('darkMode');
  const dark = saved === null ? matchMedia('(prefers-color-scheme: dark)').matches
                              : (saved === 'true' || saved === '1' || saved === 'on');
  document.documentElement.classList.toggle('dark', dark);
  document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#14130F' : '#F6F3EC');
  const b = document.getElementById('theme');
  if (b) b.textContent = dark ? '흰 지면' : '먹 지면';
}
function bindTheme() {
  const b = document.getElementById('theme');
  if (!b) return;
  b.onclick = () => {
    localStorage.setItem('darkMode', String(!document.documentElement.classList.contains('dark')));
    paintTheme();
  };
  paintTheme();
}

/* 시작 */
paintTheme(); bindTheme();
mark(FIREBASE_OK ? 'busy' : 'off');
document.getElementById('gaugebar').style.display = 'none';
history.replaceState({ v: 'home' }, '');
draw();
pull().then(watch);
</script>
</body>
