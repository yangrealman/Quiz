<style>
/* ═══════════════════════════════════════════════════════════════
   색 — 파스텔 블루 & 화이트 / 네이비 다크
   ═══════════════════════════════════════════════════════════════ */
:root {
  --paper:   #FAFCFF;
  --surface: #FFFFFF;
  --mist:    #EAF2FD;
  --line:    #DCE7F7;
  --ink:     #0E1C31;
  --muted:   #64789B;
  --blue:    #3D7FD6;
  --blue-deep: #2A5FA8;
  --blue-soft: #BBD4F2;
  --shadow:  0 1px 2px rgba(14,28,49,0.04), 0 12px 32px -20px rgba(14,28,49,0.28);

  --edge: clamp(20px, 6vw, 88px);
  --rail: 0px;
}
html.dark {
  --paper:   #0B1526;
  --surface: #132239;
  --mist:    #17273F;
  --line:    #24374F;
  --ink:     #E8EFF9;
  --muted:   #94A8C6;
  --blue:    #6FA8F2;
  --blue-deep: #A2C7F8;
  --blue-soft: #2A4467;
  --shadow:  0 1px 2px rgba(0,0,0,0.3), 0 16px 40px -24px rgba(0,0,0,0.8);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html {
  scroll-snap-type: y proximity;
  scroll-behavior: smooth;
  background: var(--paper);
  -webkit-text-size-adjust: 100%;
}
body {
  font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
               'Noto Sans KR', 'Segoe UI', sans-serif;
  color: var(--ink);
  background: var(--paper);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; scroll-snap-type: none; }
}

/* ── 상단 바 ────────────────────────────────────────────────── */
.top {
  position: fixed; inset: 0 0 auto 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  padding: 14px var(--edge);
  background: color-mix(in srgb, var(--paper) 82%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid transparent;
  transition: border-color 0.3s ease;
}
.top.stuck { border-bottom-color: var(--line); }
.brand {
  display: inline-flex; align-items: center; gap: 9px;
  font-size: 14px; font-weight: 700; letter-spacing: -0.3px;
  color: var(--ink); text-decoration: none;
}
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--blue-soft);
  transition: background 0.3s ease, box-shadow 0.3s ease;
}
.dot.ok   { background: #34B27B; box-shadow: 0 0 0 3px rgba(52,178,123,0.16); }
.dot.busy { background: var(--blue); box-shadow: 0 0 0 3px rgba(61,127,214,0.18); animation: pulse 1.1s ease-in-out infinite; }
.dot.off  { background: #D06A6A; box-shadow: 0 0 0 3px rgba(208,106,106,0.16); }
@keyframes pulse { 50% { opacity: 0.35; } }

.top-acts { display: flex; align-items: center; gap: 6px; }
.tbtn {
  height: 34px; padding: 0 13px;
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--muted);
  font: inherit; font-size: 12.5px; font-weight: 600;
  cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: color 0.18s, border-color 0.18s, transform 0.14s, background 0.18s;
}
.tbtn:hover { color: var(--blue); border-color: var(--blue-soft); transform: translateY(-1px); }
.tbtn:active { transform: translateY(0); }
.tbtn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 560px) { .tbtn-wide { display: none; } }

/* ── 왼쪽 인덱스 레일 (이 화면의 성격을 만드는 장치) ─────────── */
.rail {
  position: fixed; left: var(--edge); top: 50%; transform: translateY(-50%);
  z-index: 30; display: none; flex-direction: column; gap: 2px;
  padding-left: 15px;
}
.rail::before {
  content: ""; position: absolute; left: 0; top: 4px; bottom: 4px;
  width: 1px; background: var(--line);
}
.rail::after {
  content: ""; position: absolute; left: 0; top: 4px;
  width: 1px; height: var(--progress, 0%);
  background: var(--blue);
  transition: height 0.25s ease-out;
}
.rail a {
  display: flex; align-items: baseline; gap: 8px;
  padding: 5px 0; text-decoration: none;
  font-size: 12px; font-weight: 600; color: var(--muted);
  opacity: 0.55; transition: opacity 0.22s, color 0.22s, transform 0.22s;
}
.rail a em {
  font-style: normal; font-size: 11px; font-weight: 700;
  color: var(--blue); font-variant-numeric: tabular-nums;
  opacity: 0; transition: opacity 0.22s;
}
.rail a:hover { opacity: 1; color: var(--ink); }
.rail a.on { opacity: 1; color: var(--ink); transform: translateX(3px); }
.rail a.on em { opacity: 1; }
@media (min-width: 1024px) {
  .rail { display: flex; }
  :root { --rail: 150px; }
}

/* ── 섹션 공통 ──────────────────────────────────────────────── */
.sec {
  min-height: 100svh;
  scroll-snap-align: start;
  display: flex; flex-direction: column; justify-content: center;
  padding: 108px var(--edge) 84px;
  padding-left: calc(var(--edge) + var(--rail));
  position: relative;
}
.wrap { width: 100%; max-width: 720px; }

.eyebrow {
  display: inline-flex; align-items: center; gap: 9px;
  font-size: 11px; font-weight: 700; letter-spacing: 1.8px;
  text-transform: uppercase; color: var(--blue);
  margin: 0 0 22px;
}
.eyebrow::before {
  content: ""; width: 22px; height: 1px; background: var(--blue); opacity: 0.6;
}
h1, h2 { margin: 0; letter-spacing: -0.045em; line-height: 1.14; font-weight: 800; }
h1 { font-size: clamp(30px, 6.4vw, 58px); }
h2 { font-size: clamp(25px, 4.6vw, 40px); }
.lede { margin: 20px 0 0; font-size: clamp(14px, 1.6vw, 16px); color: var(--muted); max-width: 46ch; }
.hi { color: var(--blue); }

/* 등장 애니메이션 */
[data-reveal] {
  opacity: 0; transform: translateY(22px);
  transition: opacity 0.62s cubic-bezier(0.22,1,0.36,1), transform 0.62s cubic-bezier(0.22,1,0.36,1);
  transition-delay: calc(var(--i, 0) * 80ms);
}
.sec.in [data-reveal] { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  [data-reveal] { opacity: 1 !important; transform: none !important; transition: none !important; }
}

/* ── 버튼 ───────────────────────────────────────────────────── */
.acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 34px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 50px; padding: 0 26px; border-radius: 14px;
  font: inherit; font-size: 14.5px; font-weight: 700; letter-spacing: -0.2px;
  text-decoration: none; cursor: pointer; border: 1px solid transparent;
  transition: transform 0.16s cubic-bezier(0.22,1,0.36,1), box-shadow 0.2s, background 0.2s, color 0.2s, border-color 0.2s;
}
.btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn-fill { background: var(--blue); color: #fff; box-shadow: 0 10px 24px -14px var(--blue); }
.btn-fill:hover { background: var(--blue-deep); transform: translateY(-2px); box-shadow: 0 16px 30px -16px var(--blue); }
html.dark .btn-fill { color: #0B1526; }
.btn-line { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-line:hover { border-color: var(--blue-soft); color: var(--blue); transform: translateY(-2px); }
.btn:active { transform: translateY(0); }

/* ── 카운트다운 ─────────────────────────────────────────────── */
.dday {
  font-size: clamp(76px, 19vw, 178px); font-weight: 800;
  letter-spacing: -0.07em; line-height: 0.9;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  display: block; margin: 8px 0 0;
}
.dday small { font-size: 0.3em; font-weight: 700; letter-spacing: -0.02em; color: var(--muted); margin-left: 4px; }
.ticker {
  margin-top: 24px; display: flex; flex-wrap: wrap; gap: 26px;
  padding-top: 22px; border-top: 1px solid var(--line);
}
.tick-k { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
.tick-v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }

/* ── 카드 ───────────────────────────────────────────────────── */
.card {
  display: block; text-decoration: none; color: inherit;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 18px; padding: 22px 24px;
  box-shadow: var(--shadow);
  transition: transform 0.2s cubic-bezier(0.22,1,0.36,1), border-color 0.2s, box-shadow 0.2s;
}
a.card:hover { transform: translateY(-3px); border-color: var(--blue-soft); }
.card-k { font-size: 11.5px; font-weight: 700; letter-spacing: 0.6px; color: var(--muted); text-transform: uppercase; }
.card-t { font-size: 19px; font-weight: 700; margin-top: 6px; letter-spacing: -0.02em; }
.card-s { font-size: 13px; color: var(--muted); margin-top: 4px; }

.grid { display: grid; gap: 12px; margin-top: 30px; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 720px) { .grid-3 { grid-template-columns: 1fr; } }

.num { font-size: 34px; font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.num span { font-size: 14px; font-weight: 700; color: var(--muted); margin-left: 3px; }

/* ── 진행률 목록 ────────────────────────────────────────────── */
.rows { margin-top: 30px; display: flex; flex-direction: column; }
.row {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px;
  padding: 17px 2px; border-top: 1px solid var(--line);
}
.row:last-child { border-bottom: 1px solid var(--line); }
.row-name { font-size: 15.5px; font-weight: 700; letter-spacing: -0.02em; }
.row-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.row-pct { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--blue); }
.bar { grid-column: 1 / -1; height: 3px; background: var(--mist); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--blue); border-radius: 999px; width: 0; transition: width 0.9s cubic-bezier(0.22,1,0.36,1); }

/* ── 빈 상태 ────────────────────────────────────────────────── */
.empty {
  margin-top: 28px; padding: 26px 24px;
  border: 1px dashed var(--line); border-radius: 18px;
  background: var(--mist);
  font-size: 14px; color: var(--muted); max-width: 46ch;
}
.empty b { display: block; color: var(--ink); font-size: 15.5px; font-weight: 700; margin-bottom: 5px; }

/* ── 다음 섹션 안내 ─────────────────────────────────────────── */
.cue {
  position: absolute; left: calc(var(--edge) + var(--rail)); bottom: 34px;
  display: inline-flex; align-items: center; gap: 8px;
  border: none; background: none; padding: 0; cursor: pointer;
  font: inherit; font-size: 11.5px; font-weight: 700; letter-spacing: 0.8px;
  color: var(--muted); text-transform: uppercase;
  transition: color 0.2s, gap 0.2s;
}
.cue:hover { color: var(--blue); gap: 12px; }
.cue svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; animation: bob 1.9s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
@media (prefers-reduced-motion: reduce) { .cue svg { animation: none; } }

.foot {
  padding: 40px var(--edge) 46px;
  padding-left: calc(var(--edge) + var(--rail));
  border-top: 1px solid var(--line);
  font-size: 12px; color: var(--muted);
  display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center;
}
.foot a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }
.foot a:hover { color: var(--blue); border-color: var(--blue-soft); }

:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 6px; }
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════════
   저장소 — index.html 과 완전히 같은 키·같은 형식
   ═══════════════════════════════════════════════════════════════ */
const KEYS = ['quiz_data','quiz_progress','quiz_wrong','quiz_starred','quiz_categories',
              'cal_data','resume_bookmark','quiz_mastery','mock_records'];

function getCache(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch (_) { return fallback; }
}
function setCache(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {} }
function getTs(key)  { return parseInt(localStorage.getItem(key + '_ts')  || '0'); }
function getRev(key) { return parseInt(localStorage.getItem(key + '_rev') || '0'); }
function setTs(key, v)  { try { localStorage.setItem(key + '_ts',  String(v)); } catch (_) {} }
function setRev(key, v) { try { localStorage.setItem(key + '_rev', String(v)); } catch (_) {} }

const getData       = () => getCache('quiz_data', {});
const getProgress   = () => getCache('quiz_progress', {});
const getWrongs     = () => getCache('quiz_wrong', []);
const getStarred    = () => getCache('quiz_starred', {});
const getCategories = () => getCache('quiz_categories', []);
const getCalData    = () => getCache('cal_data', {});
const getBookmark   = () => getCache('resume_bookmark', null);
const getMastery    = () => getCache('quiz_mastery', {});
const getMocks      = () => getCache('mock_records', []);

function getEvents() {
  const d = getCalData();
  let list = Array.isArray(d.events) ? d.events.slice() : [];
  if (!list.length && d.examDate) list = [{ name: '시험', at: new Date(d.examDate + 'T09:00:00').getTime(), main: true }];
  list.sort((a, b) => a.at - b.at);
  if (list.length && !list.some(e => e.main)) list[0].main = true;
  return list;
}
const mainEvent = () => getEvents().find(e => e.main) || getEvents()[0] || null;

/* ── 읽기 전용 동기화 ──────────────────────────────────────────
   판 번호(rev) → 시각(ts) 순으로 비교해 서버가 더 최신일 때만 내려받는다.
   이 화면에서는 서버에 절대 쓰지 않는다.                                */
let syncing = false;
async function pullSync() {
  if (!FIREBASE_OK || syncing) return;
  syncing = true; dot('busy');
  try {
    await Promise.all(KEYS.map(async key => {
      const snap = await db.collection('users').doc(USER_ID).collection('data').doc(key).get();
      if (!snap.exists) return;
      const r = snap.data();
      const rTs = r.updatedAt || 0, rRev = r.rev || 0;
      const lTs = getTs(key),      lRev = getRev(key);
      if (rRev > lRev || (rRev === lRev && rTs > lTs)) {
        setCache(key, r.value); setTs(key, rTs); setRev(key, rRev);
      }
    }));
    dot('ok');
    const t = new Date();
    document.getElementById('synced-at').textContent =
      `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')} 기준`;
  } catch (e) {
    console.warn('동기화 실패', e); dot('off');
  } finally {
    syncing = false;
    paint();
  }
}
function dot(state) {
  const d = document.getElementById('syncdot');
  d.className = 'dot ' + state;
  d.title = state === 'ok' ? '최신 데이터' : state === 'busy' ? '동기화 중' : '오프라인 — 이 기기 기록만 표시';
}

/* ── 표시 도우미 ────────────────────────────────────────────── */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function ddayNum(at) {
  const mid = ms => { const d = new Date(ms); d.setHours(0,0,0,0); return d.getTime(); };
  return Math.round((mid(at) - mid(Date.now())) / 86400000);
}
function pad(n) { return String(n).padStart(2, '0'); }

/* ═══════════════════════════════════════════════════════════════
   화면 그리기
   ═══════════════════════════════════════════════════════════════ */
let tickTimer = null;

function paint() {
  const data = getData(), prog = getProgress(), mst = getMastery();
  const cats = getCategories().filter(c => Object.keys(data[c] || {}).length);
  const wrongN = getWrongs().length;
  const starN  = Object.keys(getStarred()).length;
  const mockN  = getMocks().length;
  const bm = getBookmark();
  const ev = mainEvent();

  /* ── 1. 오늘 ── */
  const now = new Date();
  const h = now.getHours();
  const greet = h < 5 ? '늦은 밤' : h < 12 ? '아침' : h < 18 ? '오후' : '저녁';
  document.getElementById('today-date').textContent =
    `${now.getMonth() + 1}월 ${now.getDate()}일 ${'일월화수목금토'[now.getDay()]}요일 · ${greet}`;

  let line, sub;
  if (bm) {
    line = `<span class="hi">${esc(bm.cat)}</span> ${esc(bm.round)}회차<br>Q${esc(bm.qNum)}부터 이어서.`;
    sub = wrongN ? `오답 노트에 ${wrongN}개가 기다리고 있어요.` : '오답 없이 깔끔합니다. 이대로 계속 가요.';
  } else if (wrongN) {
    line = `오늘은 <span class="hi">틀린 문제 ${wrongN}개</span>부터.`;
    sub = '한 번 틀린 문제를 다시 맞히는 게 가장 빠른 길입니다.';
  } else if (cats.length) {
    line = `오늘도 <span class="hi">한 회차</span>만 끝내볼까요.`;
    sub = '회차를 고르면 마지막으로 푼 지점부터 이어집니다.';
  } else {
    line = `문제를 먼저 등록해 주세요.`;
    sub = '기존 앱의 설정에서 자격증과 회차를 추가하면 여기에 바로 나타납니다.';
  }
  document.getElementById('today-line').innerHTML = line;
  document.getElementById('today-sub').textContent = sub;

  /* ── 2. 시험일 ── */
  const examBox = document.getElementById('exam-body');
  if (ev) {
    const d = ddayNum(ev.at);
    const at = new Date(ev.at);
    const label = d === 0 ? '오늘' : d > 0 ? `D-${d}` : `D+${Math.abs(d)}`;
    examBox.innerHTML = `
      <h2 data-reveal style="--i:1">${esc(ev.name)}</h2>
      <span class="dday" data-reveal style="--i:2">${label}${d > 0 ? '<small>남음</small>' : ''}</span>
      <div class="ticker" data-reveal style="--i:3">
        <div>
          <div class="tick-k">시험 일시</div>
          <div class="tick-v">${at.getFullYear()}. ${pad(at.getMonth()+1)}. ${pad(at.getDate())} ${pad(at.getHours())}:${pad(at.getMinutes())}</div>
        </div>
        <div>
          <div class="tick-k">남은 시간</div>
          <div class="tick-v" id="tick-left">—</div>
        </div>
      </div>
      <div class="acts" data-reveal style="--i:4">
        <a class="btn btn-line" href="index.html?go=calendar">일정 관리</a>
      </div>`;
    if (tickTimer) clearInterval(tickTimer);
    const tickFn = () => {
      const el = document.getElementById('tick-left');
      if (!el) { clearInterval(tickTimer); return; }
      let ms = ev.at - Date.now();
      const passed = ms < 0; ms = Math.abs(ms);
      const dd = Math.floor(ms / 86400000), hh = Math.floor(ms / 3600000) % 24;
      const mm = Math.floor(ms / 60000) % 60, ss = Math.floor(ms / 1000) % 60;
      el.textContent = `${dd}일 ${pad(hh)}:${pad(mm)}:${pad(ss)}` + (passed ? ' 지남' : '');
    };
    tickFn();
    tickTimer = setInterval(tickFn, 1000);
  } else {
    examBox.innerHTML = `
      <h2 data-reveal style="--i:1">시험 날짜를 아직<br>등록하지 않았어요</h2>
      <div class="empty" data-reveal style="--i:2">
        <b>날짜를 넣으면 달라지는 것</b>
        남은 일수가 여기 크게 뜨고, 남은 시간이 초 단위로 흐릅니다.
      </div>
      <div class="acts" data-reveal style="--i:3">
        <a class="btn btn-fill" href="index.html?go=calendar">시험 날짜 등록</a>
      </div>`;
  }

  /* ── 3. 이어서 풀기 ── */
  const resumeBox = document.getElementById('resume-body');
  if (bm) {
    resumeBox.innerHTML = `
      <h2 data-reveal style="--i:1">${esc(bm.cat)}</h2>
      <p class="lede" data-reveal style="--i:2">${esc(bm.round)}회차 · Q${esc(bm.qNum)}에 표시를 남겨두었어요.</p>
      <div class="acts" data-reveal style="--i:3">
        <a class="btn btn-fill" href="index.html?go=resume">
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>여기서 이어하기
        </a>
        <a class="btn btn-line" href="index.html?go=home">다른 회차 고르기</a>
      </div>`;
  } else {
    resumeBox.innerHTML = `
      <h2 data-reveal style="--i:1">이어할 지점이 없어요</h2>
      <div class="empty" data-reveal style="--i:2">
        <b>이어하기 표시 남기는 법</b>
        문제를 풀다가 상단의 '이어하기'를 누르면 그 문항이 여기에 올라옵니다.
      </div>
      <div class="acts" data-reveal style="--i:3">
        <a class="btn btn-fill" href="index.html?go=home">회차 고르러 가기</a>
      </div>`;
  }

  /* ── 4. 진도 ── */
  const progBox = document.getElementById('progress-body');
  if (cats.length) {
    const rows = cats.map(cat => {
      const rounds = Object.keys(data[cat] || {});
      let total = 0, done = 0, mSum = 0;
      rounds.forEach(r => {
        const qs = data[cat][r] || [];
        total += qs.length;
        done += Object.keys((prog[cat + '_' + r] || {}).answered || {}).length;
        mSum += (mst[cat + '||' + r] || 0);
      });
      const pct = total ? Math.round(done / total * 100) : 0;
      const avgM = rounds.length ? Math.round(mSum / rounds.length) : 0;
      return { cat, rounds: rounds.length, total, done, pct, avgM };
    }).sort((a, b) => b.pct - a.pct);

    progBox.innerHTML = `
      <div class="rows" data-reveal style="--i:2">
        ${rows.map(r => `
          <div class="row">
            <div>
              <div class="row-name">${esc(r.cat)}</div>
              <div class="row-sub">${r.rounds}회차 · ${r.done}/${r.total}문항 · 암기도 ${r.avgM}%</div>
            </div>
            <div class="row-pct">${r.pct}%</div>
            <div class="bar"><i data-w="${r.pct}"></i></div>
          </div>`).join('')}
      </div>`;
  } else {
    progBox.innerHTML = `
      <div class="empty" data-reveal style="--i:2">
        <b>아직 등록된 문제가 없어요</b>
        기존 앱에서 자격증과 회차를 추가하면 진도와 암기도가 여기에 쌓입니다.
      </div>`;
  }

  /* ── 5. 복습 숫자 ── */
  document.getElementById('n-wrong').innerHTML = `${wrongN}<span>개</span>`;
  document.getElementById('n-star').innerHTML  = `${starN}<span>개</span>`;
  document.getElementById('n-mock').innerHTML  = `${mockN}<span>회</span>`;

  /* ── 6. 시작 ── */
  const startBox = document.getElementById('start-body');
  if (cats.length) {
    startBox.innerHTML = `
      <div class="grid" data-reveal style="--i:2">
        ${cats.slice(0, 4).map(cat => {
          const rounds = Object.keys(data[cat] || {});
          const n = rounds.reduce((s, r) => s + (data[cat][r] || []).length, 0);
          return `
            <a class="card" href="index.html?go=home">
              <div class="card-k">자격증</div>
              <div class="card-t">${esc(cat)}</div>
              <div class="card-s">${rounds.length}회차 · ${n}문항</div>
            </a>`;
        }).join('')}
      </div>`;
  } else {
    startBox.innerHTML = `
      <div class="empty" data-reveal style="--i:2">
        <b>등록된 자격증이 없어요</b>
        기존 앱에서 자격증을 추가한 뒤 이 화면으로 돌아오면 목록이 채워집니다.
      </div>`;
  }

  /* ── 레일 숫자 ── */
  const rail = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  rail('rail-exam', ev ? (ddayNum(ev.at) >= 0 ? `D-${ddayNum(ev.at)}` : '지남') : '미등록');
  rail('rail-resume', bm ? `Q${bm.qNum}` : '없음');
  rail('rail-progress', cats.length ? `${cats.length}종` : '0');
  rail('rail-review', `${wrongN + starN}`);
  rail('rail-start', `${cats.length}`);

  observe();
}

/* ═══════════════════════════════════════════════════════════════
   스크롤 인터랙션
   ═══════════════════════════════════════════════════════════════ */
let io = null;
function observe() {
  const secs = [...document.querySelectorAll('.sec')];
  const links = [...document.querySelectorAll('.rail a')];
  if (io) io.disconnect();

  io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.classList.add('in');
      e.target.querySelectorAll('.bar i').forEach(b => { b.style.width = (b.dataset.w || 0) + '%'; });
      if (e.intersectionRatio > 0.5) {
        const i = secs.indexOf(e.target);
        links.forEach((a, j) => a.classList.toggle('on', j === i));
      }
    });
  }, { threshold: [0.15, 0.55] });
  secs.forEach(s => io.observe(s));
  secs[0].classList.add('in');
}

addEventListener('scroll', () => {
  const max = document.body.scrollHeight - innerHeight;
  const p = max > 0 ? Math.min(100, (scrollY / max) * 100) : 0;
  document.getElementById('rail').style.setProperty('--progress', p + '%');
  document.getElementById('top').classList.toggle('stuck', scrollY > 8);
}, { passive: true });

document.addEventListener('click', e => {
  const cue = e.target.closest('.cue');
  if (!cue) return;
  document.querySelector(cue.dataset.next)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

/* ── 밝기 (기존 앱의 darkMode 값을 그대로 씀) ── */
function applyTheme() {
  const saved = localStorage.getItem('darkMode');
  const dark = saved === null
    ? matchMedia('(prefers-color-scheme: dark)').matches
    : saved === 'true' || saved === '1' || saved === 'on';
  document.documentElement.classList.toggle('dark', dark);
  document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#0B1526' : '#FAFCFF');
  document.getElementById('theme-ic').innerHTML = dark
    ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>'
    : '<path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/>';
}
document.getElementById('theme').addEventListener('click', () => {
  const dark = !document.documentElement.classList.contains('dark');
  localStorage.setItem('darkMode', String(dark));   // 기존 앱과 같은 값
  applyTheme();
});
document.getElementById('resync').addEventListener('click', pullSync);

/* ── 시작 ── */
applyTheme();
dot(FIREBASE_OK ? 'busy' : 'off');
paint();
pullSync();
addEventListener('online', pullSync);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pullSync(); });
</script>
</body>
</html>
