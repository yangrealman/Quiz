<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#EFF1F5">
<title>양진웅 Note — 한 화면</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyC6fOvzE69mucSuCgDVl-sB5s1eFgKQQaA",
    authDomain: "quiz-app-f6c45.firebaseapp.com",
    projectId: "quiz-app-f6c45",
    storageBucket: "quiz-app-f6c45.firebasestorage.app",
    messagingSenderId: "66139024814",
    appId: "1:66139024814:web:7e1ac161bee6308fee6c3f"
  };
  const USER_ID = 'main';

  function _offlineDb() {
    const fail = () => Promise.reject(new Error('offline'));
    const docRef = { get: fail, set: fail, delete: fail, onSnapshot: () => (() => {}) };
    const dataCol = { doc: () => docRef };
    return { collection: () => ({ doc: () => ({ collection: () => dataCol }) }) };
  }
  let _fbDb = null;
  let db = _offlineDb();
  let FIREBASE_OK = false;
  try {
    firebase.initializeApp(firebaseConfig);
    _fbDb = firebase.firestore();
  } catch (e) {}

  // ── 로그인 ── 정식 화면과 같은 방식. 로그인 전에는 서버로 나가는 요청 자체가 없다.
  let AUTH_USER = null, AUTH_SETTLED = false, _gateSkipped = false;
  function _paintAuthGate() {
    const g = document.getElementById('auth-gate');
    if (!g) return;
    // Firebase 스크립트를 못 받았으면(오프라인) 로그인 창을 띄우지 않는다 — 들어갈 방법도 없다
    g.style.display = (_fbDb && AUTH_SETTLED && !AUTH_USER && !_gateSkipped) ? 'flex' : 'none';
  }
  function _applyAuth(user) {
    AUTH_USER = user || null; AUTH_SETTLED = true;
    FIREBASE_OK = !!(user && _fbDb);
    db = FIREBASE_OK ? _fbDb : _offlineDb();
    _paintAuthGate();
    if (typeof window._afterAuth === 'function') { try { window._afterAuth(user); } catch (e) {} }
  }
  if (_fbDb) {
    try {
      firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
      firebase.auth().onAuthStateChanged(_applyAuth);
    } catch (e) { AUTH_SETTLED = true; }
  } else { AUTH_SETTLED = true; }
  document.addEventListener('DOMContentLoaded', _paintAuthGate);

  const AUTH_MSG = {
    'auth/invalid-email': '이메일 형식이 올바르지 않아요',
    'auth/user-not-found': '그런 계정이 없어요',
    'auth/wrong-password': '비밀번호가 달라요',
    'auth/invalid-credential': '이메일이나 비밀번호가 달라요',
    'auth/too-many-requests': '여러 번 틀려서 잠시 막혔어요. 조금 뒤에 다시 해주세요',
    'auth/network-request-failed': '인터넷에 연결되지 않았어요',
    'auth/user-disabled': '사용 중지된 계정이에요',
  };
  async function authSignIn() {
    const em = document.getElementById('auth-email'), pw = document.getElementById('auth-pw');
    const err = document.getElementById('auth-err'), btn = document.getElementById('auth-btn');
    if (!_fbDb) { err.textContent = '지금은 인터넷에 연결되지 않아 로그인할 수 없어요'; return; }
    const email = (em.value || '').trim(), pass = pw.value || '';
    if (!email || !pass) { err.textContent = '이메일과 비밀번호를 넣어주세요'; return; }
    btn.disabled = true; btn.textContent = '들어가는 중…'; err.textContent = '';
    try { await firebase.auth().signInWithEmailAndPassword(email, pass); pw.value = ''; }
    catch (e) { err.textContent = AUTH_MSG[e && e.code] || ((e && e.message) || '로그인하지 못했어요'); }
    btn.disabled = false; btn.textContent = '로그인';
  }
  function authSkip() { _gateSkipped = true; _paintAuthGate(); }

  // 화면이 그려지기 전에 테마부터 입힌다 (안 그러면 어둡게 써도 흰 화면이 한 번 번쩍인다)
  try {
    document.documentElement.setAttribute('data-theme', localStorage.getItem('study_theme') || 'light');
  } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
</script>

<style>
/* ══════════════════════════════════════════════════════════════════════
   한 화면 — 홈도 탭바도 없다. 열면 곧바로 문제고, 위 알약 하나로 무엇이
   흘러올지만 고른다.

   [원칙]
     · 유리(반투명 판)에는 짧은 글만. 문제 본문은 유리 위에 올리지 않는다
       — 흐림 위의 긴 글은 예쁘지만 안 읽힌다.
     · 색은 뜻이 있을 때만(맞음·틀림·지금 고른 것). 그 외에는 무채색.
     · 움직임은 '어디서 와서 어디로 가는지'를 설명할 때만 쓴다.
     · 폰과 PC 는 같은 구조. 넓어지면 글줄을 늘리는 대신 여백을 주고,
       남는 자리에 해설을 놓는다.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --ink:#14161C; --ink2:#3A4050; --ink3:#6C7284; --ink4:#9096A6;
  --line:rgba(20,24,40,.09);
  --glass:rgba(255,255,255,.58); --glass-edge:rgba(255,255,255,.75);
  --glass-hi:rgba(255,255,255,.95);
  --accent:#5A63F0; --accent-soft:rgba(90,99,240,.14);
  --ok:#2EB27C; --no:#E25A50; --star:#F2A93B;
  --bg:#EFF1F5;
  --sheet:rgba(255,255,255,.66);
  --shadow:0 30px 60px -26px rgba(16,20,40,.46);
  --ease:cubic-bezier(.22,1,.36,1);
}
:root[data-theme="dark"]{
    --ink:#F0F2F7; --ink2:#C3C8D6; --ink3:#98A0B2; --ink4:#6E7488;
    --line:rgba(255,255,255,.10);
    --glass:rgba(255,255,255,.08); --glass-edge:rgba(255,255,255,.13);
    --glass-hi:rgba(255,255,255,.12);
    --accent:#7A84FF; --accent-soft:rgba(122,132,255,.20);
    --bg:#0D0F15; --sheet:rgba(26,29,38,.74);
    --shadow:0 30px 60px -26px rgba(0,0,0,.9);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  -webkit-text-size-adjust:100%; overflow:hidden;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* 바탕의 옅은 색 뭉치 — 유리가 얹힐 자리 */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.85}
#bg .b1{width:70vmin;height:70vmin;left:-18vmin;top:-16vmin;background:rgba(122,132,255,.36)}
#bg .b2{width:62vmin;height:62vmin;right:-18vmin;bottom:-14vmin;background:rgba(255,168,120,.30)}
#bg .b3{width:52vmin;height:52vmin;left:44%;bottom:-22vmin;background:rgba(120,220,190,.28)}
:root[data-theme="dark"] #bg .b1{background:rgba(108,120,255,.26)}
:root[data-theme="dark"] #bg .b2{background:rgba(255,140,90,.16)}
:root[data-theme="dark"] #bg .b3{background:rgba(80,200,170,.14)}

/* 유리 공통 */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(1.7); backdrop-filter:blur(24px) saturate(1.7);
  border:1px solid var(--glass-edge);
  box-shadow:0 1px 0 var(--glass-hi) inset, 0 6px 18px -10px rgba(20,24,40,.3);
}

#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  padding:0 max(22px, env(safe-area-inset-left)) 0 max(22px, env(safe-area-inset-right))}

/* ── 위 한 줄 ── */
#top{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 16px);flex:none}
#dial{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;
  font-size:12.5px;color:var(--ink3);font-weight:600;letter-spacing:-.2px;max-width:76vw;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  transition:transform .18s var(--ease), background .18s}
#dial:active{transform:scale(.97)}
#dial b{color:var(--ink);font-weight:700}
#dial .car{width:5px;height:5px;flex:none;border-right:1.6px solid var(--ink4);
  border-bottom:1.6px solid var(--ink4);transform:rotate(45deg) translateY(-1px);
  transition:transform .26s var(--ease)}
#dial.open .car{transform:rotate(225deg) translateY(2px)}
#topr{display:flex;align-items:center;gap:8px;flex:none}
#theme{width:34px;height:34px;border-radius:999px;flex:none;font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;color:var(--ink3);
  transition:transform .18s var(--ease)}
#theme:active{transform:scale(.92)}
/* 제출 — 모의고사를 푸는 동안에만 나온다 */
#submit{display:none;padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:700;
  color:#fff;background:var(--accent);border:1px solid var(--accent);white-space:nowrap;
  box-shadow:0 6px 18px -8px rgba(90,99,240,.7);transition:transform .18s var(--ease),opacity .2s}
#submit:active{transform:scale(.96)}
body.mock #submit{display:inline-flex}

/* ── 본문 ── */
#stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:0;align-items:stretch;
  transition:transform .34s var(--ease), filter .34s var(--ease), opacity .34s var(--ease)}
#stage.pushed{transform:scale(.965) translateY(10px);filter:blur(3px);opacity:.45}
#stage.swap{opacity:0;transform:translateY(12px)}
/* [주의] 가운데 정렬(justify-content:center)로 두면 해설이 뜨는 순간 덩어리가 다시
   가운데를 맞추느라 문제가 위로 밀린다. 눈이 문제를 다시 찾아야 해서, 위에서
   일정한 자리에 고정한다 — 답을 골라도 문제는 제자리에 그대로 있는다.
   [수정] 해설을 문제 기둥(#main) 안에 두었더니 넓은 화면에서도 기둥 안에 갇혔다.
          감싸는 칸(#scroll)을 하나 두고 그 안에 문제·해설 두 기둥을 세운다. */
#scroll{flex:1;min-width:0;width:100%;max-width:700px;margin:0 auto;overflow-y:auto;padding:12vh 0 12px}
#main{display:flex;flex-direction:column;justify-content:flex-start}
#qnum{font-size:11px;font-weight:800;color:var(--ink4);letter-spacing:.16em;margin-bottom:12px;flex:none}
#qtext{font-size:23px;line-height:1.52;font-weight:600;letter-spacing:-.45px;white-space:pre-wrap;
  word-break:break-word;flex:none}

/* ── 문제 그림 (작업형 도면 등) ──
   [주의] 그림을 해설 자리(넓은 화면의 오른쪽 기둥)에 넣지 않는다. 외워야 하는 것은
   해설이라, 오른쪽 한 칸은 통째로 해설에게 준다. 그림은 문제의 일부이므로
   넓은 화면에서는 문제 바로 아래에, 폰에서는 화면 위에 붙여 둔다
   (아래에서 답을 쓰며 스크롤해도 그림이 계속 보여야 하기 때문). */
#imgdock{flex:none}
#imgwrap{display:none}
#imgwrap.show{display:block}
#imgcard{border-radius:18px;padding:9px;overflow:hidden;margin-top:14px}
#qimg{display:none;width:100%;height:auto;max-height:30vh;object-fit:contain;
  border-radius:11px;background:#fff;cursor:zoom-in}
#imgmsg{display:none;padding:16px 4px;text-align:center;font-size:12.5px;color:var(--ink4)}
#imgmsg.show{display:block}
#imgmsg button{margin-left:8px;padding:5px 11px;border-radius:999px;font-size:12px;color:var(--ink2);
  background:var(--glass);border:1px solid var(--glass-edge)}
#imgbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 4px 0;font-size:11px;color:var(--ink4)}
#imgfold{padding:4px 11px;border-radius:999px;font-size:11px;color:var(--ink3);
  background:var(--glass);border:1px solid var(--glass-edge);transition:background .18s}
#imgfold:active{background:var(--accent-soft)}
#imgwrap.fold #imgcard{display:none}
/* 접혀 있으면 카드가 사라져 띠가 문제에 바짝 붙는다 — 그만큼 띄운다 */
#imgwrap.fold #imgbar{padding-top:16px}
/* 폰 — 그림 칸이 위에 붙어 있으니 문제는 그 아래에서 시작한다 */
#imgdock #imgwrap.show{padding-bottom:10px;border-bottom:1px solid var(--line)}
body.has-img #scroll{padding-top:20px}
/* 해설 그림 */
#expimg:empty{display:none}
#expimg{margin-top:14px}
#expimg img{display:block;width:100%;border-radius:12px;background:#fff;cursor:zoom-in}
#expimg .eimg-msg{font-size:12.5px;color:var(--ink4);padding:8px 0}
#ops{margin-top:26px;display:flex;flex-direction:column;gap:2px;flex:none}
.op{display:flex;gap:13px;align-items:flex-start;padding:13px 12px;border-radius:14px;text-align:left;
  font-size:15.5px;line-height:1.45;color:var(--ink2);letter-spacing:-.2px;width:100%;
  transition:background .3s var(--ease), color .3s var(--ease)}
.op .no{flex:none;width:21px;height:21px;border-radius:50%;font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;color:var(--ink4);margin-top:1px;
  background:var(--glass);border:1px solid var(--glass-edge);
  transition:background .3s var(--ease), color .3s var(--ease), border-color .3s var(--ease)}
.op:active{background:var(--accent-soft)}
.op.ok{background:rgba(46,178,124,.13);color:var(--ink)}
.op.ok .no{background:var(--ok);border-color:var(--ok);color:#fff}
.op.bad{background:rgba(226,90,80,.11);color:var(--ink)}
.op.bad .no{background:var(--no);border-color:var(--no);color:#fff}
.op.pick{background:var(--accent-soft)}
.op.pick .no{background:var(--accent);border-color:var(--accent);color:#fff}

/* 필답형 */
#subjwrap{margin-top:22px;display:none;flex:none}
#subj{width:100%;min-height:110px;padding:14px;border-radius:16px;resize:vertical;font-size:15.5px;
  line-height:1.6;color:var(--ink);background:var(--glass);border:1px solid var(--glass-edge);
  font-family:inherit;outline:none}
#subj:focus{border-color:var(--accent)}
#judge{display:flex;gap:8px;margin-top:10px}
#judge button{flex:1;padding:12px;border-radius:14px;font-size:14px;color:var(--ink2);
  background:var(--glass);border:1px solid var(--glass-edge);transition:background .2s,color .2s}
#judge #j-ok,#judge #j-no{font-size:18px;font-weight:700;letter-spacing:1px}
#judge button.on-ok{background:var(--ok);border-color:var(--ok);color:#fff}
#judge button.on-no{background:var(--no);border-color:var(--no);color:#fff}
#judge button.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* 해설 — 폰에서는 아래, PC 에서는 오른쪽 */
#exp{display:none;margin-top:20px;border-radius:20px;padding:20px;flex:none}
#exp.show{display:block;animation:expIn .34s var(--ease)}
@keyframes expIn{from{opacity:0;transform:translateY(10px)}}
/* 스크롤 막대는 숨긴다 — 잘리면 알아서 밀어 보면 된다 */
#exp{scrollbar-width:none;-ms-overflow-style:none}
#exp::-webkit-scrollbar{width:0;height:0;display:none}
#scroll{scrollbar-width:none;-ms-overflow-style:none}
#scroll::-webkit-scrollbar{width:0;height:0;display:none}
#exp .et{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--ink4);margin-bottom:12px}
#exp .eb{font-size:15px;line-height:1.75;color:var(--ink2);white-space:pre-wrap}

/* 아래 줄 — 이전 · 진도 · 다음.
   [수정] 처음엔 진도 실낱만 뒀는데, 폰에서는 다음 문제로 넘길 방법이 아예 없었다.
          화살표 두 개만 두고 나머지는 그대로 비워 둔다. 막대는 끌어서 옮길 수 있다. */
#foot{display:flex;align-items:center;gap:14px;flex:none;width:100%;max-width:700px;
  margin:0 auto calc(env(safe-area-inset-bottom,0px) + 20px)}
.arrow{width:34px;height:34px;border-radius:999px;flex:none;display:flex;align-items:center;
  justify-content:center;color:var(--ink3);font-size:15px;transition:transform .16s var(--ease),opacity .2s}
.arrow:active{transform:scale(.9)}
.arrow:disabled{opacity:.28}
#bar{position:relative;flex:1;height:26px;display:flex;align-items:center;cursor:pointer;touch-action:none}
#bar::before{content:"";position:absolute;left:0;right:0;height:2px;border-radius:2px;background:var(--line)}
#bar i{position:relative;display:block;height:2px;width:0;background:var(--accent);border-radius:2px;
  transition:width .45s var(--ease)}
#bar.drag i{transition:none}
#bar b{position:absolute;top:-1px;width:12px;height:12px;border-radius:50%;background:var(--accent);
  margin-left:-6px;box-shadow:0 2px 6px rgba(20,24,40,.28);opacity:0;transform:scale(.6);
  transition:opacity .2s,transform .2s var(--ease)}
#bar:hover b,#bar.drag b{opacity:1;transform:scale(1)}
#bar.drag b{transform:scale(1.25)}

/* ── 고르는 곳 (다이얼 판) ── */
#sheet{position:fixed;z-index:20;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 8px);
  border-radius:26px;padding:8px;background:var(--sheet);
  -webkit-backdrop-filter:blur(30px) saturate(1.8); backdrop-filter:blur(30px) saturate(1.8);
  border:1px solid var(--glass-edge);box-shadow:0 1px 0 var(--glass-hi) inset, var(--shadow);
  opacity:0;transform:translateY(-14px) scale(.98);pointer-events:none;
  transition:opacity .26s var(--ease), transform .3s var(--ease);
  max-height:80vh;overflow-y:auto}
#sheet.show{opacity:1;transform:none;pointer-events:auto}
.srow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;width:100%;
  font-size:15px;color:var(--ink2);letter-spacing:-.2px;text-align:left;
  transition:background .18s}
.srow:active{background:var(--accent-soft)}
.srow .dot{width:6px;height:6px;border-radius:50%;background:var(--ink4);opacity:.5;flex:none}
.srow .n{margin-left:auto;font-size:13px;color:var(--ink4);font-variant-numeric:tabular-nums;flex:none}
.srow.on{background:var(--accent-soft);color:var(--ink);font-weight:700}
.srow.on .dot{background:var(--accent);opacity:1}
.srow.on .n{color:var(--accent);font-weight:700}
.sdiv{height:1px;background:var(--line);margin:6px 16px}
.slab{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--ink4);padding:12px 16px 5px}
.shint{font-size:12px;line-height:1.6;color:var(--ink3);padding:4px 16px 8px}
.shint b{color:var(--ink2);font-weight:700}
#scrim{position:fixed;inset:0;z-index:15;background:transparent;display:none}
#scrim.show{display:block}
/* 고르는 판이 열려 있는 동안 도구 막대는 감춘다 — 뒤에 비치고 눌리기까지 한다 */
body.sheet-open #tool{opacity:0 !important;pointer-events:none !important}

/* ── 도구 (문제를 길게 누르면 / PC 는 오른쪽 막대) ── */
#tool{position:fixed;z-index:25;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
  border-radius:26px;padding:16px 14px 14px;background:var(--sheet);
  -webkit-backdrop-filter:blur(30px) saturate(1.8); backdrop-filter:blur(30px) saturate(1.8);
  border:1px solid var(--glass-edge);box-shadow:0 1px 0 var(--glass-hi) inset, var(--shadow);
  opacity:0;transform:translateY(22px);pointer-events:none;
  transition:opacity .24s var(--ease), transform .3s var(--ease)}
#tool.show{opacity:1;transform:none;pointer-events:auto}
#tool .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 15px}
#stars{display:flex;justify-content:center;gap:10px;margin-bottom:15px}
#stars button{font-size:25px;line-height:1;color:var(--ink4);opacity:.4;
  transition:transform .16s var(--ease), color .16s, opacity .16s}
#stars button.on{color:var(--star);opacity:1}
#stars button:active{transform:scale(1.22)}
.trow{display:flex;gap:8px}
.tbtn{flex:1;padding:12px 0;border-radius:16px;text-align:center;font-size:12.5px;color:var(--ink2);
  background:var(--glass);border:1px solid var(--glass-edge);transition:background .18s,color .18s}
.tbtn b{display:block;font-size:17px;font-weight:500;margin-bottom:3px}
.tbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* ── 토스트 ── */
#toast{position:fixed;z-index:40;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);
  transform:translate(-50%,10px);opacity:0;pointer-events:none;
  padding:10px 18px;border-radius:999px;font-size:13.5px;color:#fff;background:rgba(16,18,26,.86);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  transition:opacity .22s var(--ease), transform .28s var(--ease);max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ── 빈 화면 / 불러오는 중 ── */
/* [주의] #stage 에 position:relative 가 없으면 이 안내가 #app 기준으로 펼쳐져
   화면 전체(위 알약 포함)를 덮는다 — 그러면 알약이 눌리지 않아 갇힌다.
   혹시 모를 경우를 대비해 클릭도 통과시킨다. */
#empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;text-align:center;color:var(--ink3);font-size:14.5px;line-height:1.7;
  pointer-events:none}
#empty.show{display:flex}
#empty .big{font-size:17px;color:var(--ink);font-weight:600}

/* ── 로그인 ── */
#auth-gate{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);
  align-items:center;justify-content:center;padding:24px}
.auth-box{width:100%;max-width:340px;border-radius:22px;padding:26px 22px;
  background:var(--sheet);-webkit-backdrop-filter:blur(30px); backdrop-filter:blur(30px);
  border:1px solid var(--glass-edge);box-shadow:0 1px 0 var(--glass-hi) inset, var(--shadow)}
.auth-t{font-size:21px;font-weight:800;text-align:center;letter-spacing:-.3px}
.auth-s{font-size:13px;color:var(--ink3);text-align:center;margin:6px 0 18px}
.auth-in{width:100%;padding:13px 14px;margin-bottom:10px;border-radius:12px;font-size:16px;
  color:var(--ink);background:var(--glass);border:1px solid var(--glass-edge);font-family:inherit;outline:none}
.auth-in:focus{border-color:var(--accent)}
.auth-err{font-size:13px;color:var(--no);min-height:18px;margin-bottom:6px}
.auth-btn{width:100%;padding:13px;border-radius:12px;background:var(--accent);color:#fff;
  font-size:16px;font-weight:700}
.auth-skip{width:100%;margin-top:10px;padding:10px;color:var(--ink4);font-size:13px;text-decoration:underline}

/* ── 모의고사 결과 ── */
#res{display:none;position:relative;flex:1;min-height:0;overflow-y:auto;padding:8vh 0 20px;
  scrollbar-width:none;-ms-overflow-style:none}
#res::-webkit-scrollbar{width:0;height:0;display:none}
#res.show{display:block;animation:expIn .4s var(--ease)}
.res-in{width:100%;max-width:560px;margin:0 auto}
.res-where{font-size:12.5px;color:var(--ink3);letter-spacing:-.2px}
.res-big{font-size:64px;font-weight:800;letter-spacing:-2.5px;line-height:1.1;margin:4px 0 2px}
.res-big small{font-size:20px;font-weight:700;margin-left:3px;letter-spacing:-.5px}
.res-line{font-size:14px;color:var(--ink2);letter-spacing:-.2px}
.res-line b{color:var(--ink);font-weight:700}
.res-acts{display:flex;gap:8px;margin:22px 0 26px}
.res-acts button{flex:1;padding:12px 6px;border-radius:16px;font-size:13px;color:var(--ink2);
  transition:background .18s}
.res-acts button:active{background:var(--accent-soft)}
.res-label{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--ink4);margin-bottom:10px}
.res-row{display:flex;align-items:center;gap:11px;width:100%;padding:12px 12px;border-radius:14px;
  text-align:left;font-size:14px;color:var(--ink2);transition:background .18s}
.res-row:active{background:var(--accent-soft)}
.res-row .rq{flex:none;font-size:11px;font-weight:800;color:var(--no);letter-spacing:.04em;min-width:34px}
.res-row .rt{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.res-row .rr{flex:none;font-size:12px;color:var(--ink4)}
/* 결과를 보는 동안에는 아래 줄(이전·다음)과 그림 칸을 감춘다 */
body.result #foot,body.result #imgdock{display:none}
body.result #scroll{display:none}

/* ── 그림 크게 보기 ── */
#lb{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(10,12,18,.93);-webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  opacity:0;transition:opacity .24s var(--ease);overflow:hidden;touch-action:none}
#lb.show{display:flex;opacity:1}
#lb img{max-width:94vw;max-height:80vh;border-radius:10px;background:#fff;
  transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none}
#lb-x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;width:36px;height:36px;
  border-radius:999px;background:rgba(255,255,255,.16);color:#fff;font-size:16px;
  display:flex;align-items:center;justify-content:center}
#lb-h{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  text-align:center;color:rgba(255,255,255,.48);font-size:12px;padding:0 20px}

/* ── 넓은 화면 ── */
@media (min-width:900px){
  #app{padding:0 30px}
  #stage{flex-direction:row;gap:26px}
  /* [수정] 처음엔 해설이 뜰 때 문제 기둥이 왼쪽으로 밀려났다.
     이제 두 기둥을 늘 나란히 세우고(문제 왼쪽·해설 오른쪽), 오른쪽은 비워 둔다.
     해설은 그 빈 자리를 채울 뿐이라 문제는 처음부터 끝까지 제자리에 있는다. */
  #stage{padding-bottom:0}
  /* 문제와 해설을 나란히 세우고 둘을 통째로 가운데에 둔다.
     오른쪽 기둥은 처음부터 자리를 잡고 비어 있다가 해설이 채운다 —
     그래서 답을 골라도 문제 기둥은 1px 도 움직이지 않는다. */
  #scroll{display:flex;align-items:flex-start;justify-content:center;
    gap:clamp(30px,4vw,60px);max-width:none;padding:16vh 0 16px}
  #main{width:min(700px,50vw);flex:none}
  #exp{display:block;width:min(420px,28vw);flex:none;margin:0;position:static;
    max-height:66vh;overflow-y:auto;opacity:0;transform:translateX(18px);visibility:hidden;
    transition:opacity .32s var(--ease), transform .36s var(--ease);pointer-events:none}
  #exp.show{opacity:1;transform:none;visibility:visible;pointer-events:auto;animation:none}
  /* 그림은 문제 기둥 안, 문제 바로 아래 — 오른쪽 기둥은 해설만 쓴다 */
  #imgdock{display:none}
  #imgcard{margin-top:18px}
  #qimg{max-height:34vh}
  body.has-img #scroll{padding-top:10vh}
  #sheet{left:30px;right:auto;width:340px;top:64px}
  /* 진도선은 글 기둥에 맞추기 어려우니(해설이 열리면 기둥이 왼쪽으로 간다)
     화면 전체를 가로지르는 실낱으로 둔다 */
  #foot{max-width:none}
  /* 도구는 아래 판이 아니라 오른쪽 끝 막대 */
  /* [주의] 도구 막대를 오른쪽에 두면 해설판과 겹친다 — 넓은 화면에서 늘 비어 있는
     왼쪽 여백으로 보낸다. 평소엔 흐리게 있다가 마우스가 가면 또렷해진다. */
  /* [수정] 막대 전체를 흐리게(opacity) 두었더니 별표·체크가 켜져 있어도 흐려져서
     구분이 안 됐다. 이제 판 자체만 옅게 두고, 켜진 것은 늘 또렷하게 남긴다. */
  #tool{left:22px;right:auto;top:50%;bottom:auto;width:64px;padding:9px 7px;
    transform:translate(-14px,-50%);border-radius:22px;opacity:1;
    background:transparent;border-color:transparent;box-shadow:none}
  #tool.show{transform:translate(0,-50%);background:var(--glass);border-color:var(--glass-edge);
    box-shadow:0 1px 0 var(--glass-hi) inset, var(--shadow)}
  #tool.rail{pointer-events:auto}
  /* 꺼진 것은 아주 옅게, 켜진 것은 제 색으로 */
  #tool:not(.show) #stars button{opacity:.22}
  #tool:not(.show) #stars button.on{opacity:1}
  #tool:not(.show) .tbtn{opacity:.22;background:transparent;border-color:transparent}
  #tool:not(.show) .tbtn.on{opacity:1;background:var(--accent-soft);border-color:var(--accent)}
  #tool .grab{display:none}
  #stars{flex-direction:column;gap:2px;margin-bottom:8px}
  #stars button{font-size:17px}
  .trow{flex-direction:column;gap:4px}
  .tbtn{padding:9px 0;font-size:10px}
  .tbtn b{font-size:15px;margin-bottom:1px}
  #toast{bottom:34px}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div id="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<div id="app">
  <div id="top">
    <button id="dial" class="glass" onclick="toggleSheet()"><span id="dial-t">불러오는 중…</span> <span class="car"></span></button>
    <div id="topr">
      <button id="submit" onclick="submitMock()">제출</button>
      <button id="theme" class="glass" onclick="toggleTheme()" title="밝게 / 어둡게" aria-label="밝게 / 어둡게">☾</button>
    </div>
  </div>

  <div id="stage">
    <!-- 그림 칸은 화면 넓이에 따라 여기(폰 · 위에 붙어 안 움직임)와
         #imgslot(넓은 화면 · 문제 바로 아래) 사이를 오간다 -->
    <div id="imgdock"></div>
    <div id="scroll">
    <div id="main">
      <div id="qnum"></div>
      <div id="qtext"></div>
      <div id="imgslot">
        <div id="imgwrap">
          <div id="imgcard" class="glass">
            <img id="qimg" alt="문제 그림" onclick="openLightbox()">
            <div id="imgmsg"></div>
          </div>
          <div id="imgbar">
            <span id="imgcap">그림 1장 · 눌러서 펴기</span>
            <button id="imgfold" onclick="toggleImgFold()">펴기</button>
          </div>
        </div>
      </div>
      <div id="ops"></div>
      <div id="subjwrap">
        <textarea id="subj" placeholder="여기에 답을 써보세요"></textarea>
        <div id="judge">
          <button id="j-ok" onclick="judge('correct')" title="맞았어요" aria-label="맞았어요">O</button>
          <button id="j-see" onclick="toggleAnswer()">정답</button>
          <button id="j-no" onclick="judge('wrong')" title="틀렸어요" aria-label="틀렸어요">X</button>
        </div>
      </div>
    </div>
      <div id="exp" class="glass"><div class="et">해설</div><div class="eb" id="exp-b"></div>
        <div id="expimg"></div></div>
    </div>
    <div id="empty"></div>
    <div id="res"></div>
  </div>

  <div id="foot">
    <button class="arrow glass" id="prev" onclick="move(-1)" title="이전 문제" aria-label="이전 문제">‹</button>
    <div id="bar"><i id="bar-i"></i><b id="bar-h"></b></div>
    <button class="arrow glass" id="next" onclick="move(1)" title="다음 문제" aria-label="다음 문제">›</button>
  </div>
</div>

<div id="scrim" onclick="closeAll()"></div>

<div id="sheet"></div>

<div id="tool">
  <div class="grab"></div>
  <div id="stars"></div>
  <div class="trow">
    <button class="tbtn" id="t-flag" onclick="tapFlag()"><b>☑</b>체크</button>
    <button class="tbtn" id="t-hide" onclick="tapHide()"><b>◎</b>숨기기</button>
  </div>
</div>

<div id="toast"></div>

<!-- 그림 크게 보기 — 도면은 확대해서 봐야 하니 손가락으로 넓히고 끌 수 있게 한다 -->
<div id="lb">
  <button id="lb-x" onclick="closeLightbox()" aria-label="닫기" title="닫기">✕</button>
  <img id="lb-img" alt="그림 크게 보기">
  <div id="lb-h">두 손가락으로 넓혀 크게 · 끌어서 이동 · 아무 곳이나 누르면 닫힘</div>
</div>

<div id="auth-gate">
  <div class="auth-box">
    <div class="auth-t">양진웅 Note</div>
    <div class="auth-s">내 기록을 불러오려면 로그인하세요</div>
    <input class="auth-in" id="auth-email" type="email" inputmode="email" autocomplete="username"
           placeholder="이메일" onkeydown="if(event.key==='Enter')document.getElementById('auth-pw').focus()">
    <input class="auth-in" id="auth-pw" type="password" autocomplete="current-password"
           placeholder="비밀번호" onkeydown="if(event.key==='Enter')authSignIn()">
    <div class="auth-err" id="auth-err"></div>
    <button class="auth-btn" id="auth-btn" onclick="authSignIn()">로그인</button>
    <button class="auth-skip" onclick="authSkip()">이 기기에 저장된 것만 보기</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   [형식 계약] 정식 화면(index.html)과 같은 저장소·같은 형식을 쓴다.
   한 글자라도 어긋나면 두 화면이 서로 다른 걸 보게 된다.

     quiz_progress  { 자격증_회차: { answered: { 원래문항자리: 답 }, at, idx } }
     quiz_wrong     [ { id: 자격증_회차_문항id, cat, round, q, myAnswer, addedAt } ]
     quiz_starred   { 자격증||회차||문항id: { cat, round, qId, level(1~5), addedAt } }
     quiz_flagged   { 자격증||회차||문항id: { cat, round, qId, addedAt } }
     quiz_hidden    { 자격증||회차||문항id: { cat, round, qId, addedAt } }
     mock_records   [ { id, cat, mode, date, correct, total, pct, timeUsed, wrongCount,
                        questionLog:[{round,qNum}] } ]
     mock_wrong     [ { id: mock_시험번호_자격증_회차_번호, cat, round, q, myAnswer, mockId, addedAt } ]
     mock_deck      { 자격증: [ '회차||번호', … ] }   ← '눈 돌리기'로 이미 낸 문제

   study_mock 만은 이 화면 전용이다(이 기기에만 남는다) — 아직 제출하지 않은 시험을
   되살리기 위한 것이라, 서버로도 정식 화면으로도 가지 않는다.

   답(answered) 값: 객관식은 고른 보기 번호(0부터), 필답형은 'correct'/'wrong'.
   0 이 유효한 값이라 참·거짓으로 판단하면 안 된다 — 항상 (i in answered) 로 본다.

   오답노트 규칙도 정식과 같다: 회차를 풀 때만 쌓고, 나중에 맞혔다고 지우지 않는다.
   ══════════════════════════════════════════════════════════════════════ */

/* ── 저장소 (판 번호가 큰 쪽이 최신) ── */
const _cache = {};
function _get(k, d) {
  if (_cache[k] !== undefined) return _cache[k];
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; }
}
function _set(k, v) { _cache[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function _ts(k){ try { return parseInt(localStorage.getItem(k+'_ts')||'0'); } catch(e){ return 0; } }
function _setTs(k,v){ try { localStorage.setItem(k+'_ts',String(v)); } catch(e){} }
function _rev(k){ try { return parseInt(localStorage.getItem(k+'_rev')||'0'); } catch(e){ return 0; } }
function _setRev(k,v){ try { localStorage.setItem(k+'_rev',String(v)); } catch(e){} }

const FB_TIMEOUT = 10000;
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rj) => setTimeout(() => rj(new Error('시간 초과')), ms))]);
async function fbGet(id) {
  try {
    const d = await withTimeout(db.collection('users').doc(USER_ID).collection('data').doc(id).get(), FB_TIMEOUT);
    return d.exists ? d.data() : null;
  } catch (e) { return null; }
}
async function fbSet(id, value) {
  try {
    await withTimeout(db.collection('users').doc(USER_ID).collection('data').doc(id)
      .set({ value, updatedAt: Date.now(), rev: _rev(id) }), FB_TIMEOUT);
    return true;
  } catch (e) { return false; }
}
async function save(key, value) {
  _set(key, value); _setTs(key, Date.now()); _setRev(key, _rev(key) + 1);
  await fbSet(key, value);
}

const KEYS = ['quiz_index','quiz_categories','quiz_progress','quiz_wrong',
              'quiz_starred','quiz_flagged','quiz_hidden','resume_bookmark',
              'mock_records','mock_wrong','mock_deck'];
let _syncing = false;
async function syncDown(silent) {
  if (_syncing || !FIREBASE_OK) return;
  _syncing = true;
  try {
    await Promise.all(KEYS.map(async key => {
      const remote = await fbGet(key);
      if (!remote) return;
      const rRev = remote.rev || 0, rTs = remote.updatedAt || 0;
      const lRev = _rev(key), lTs = _ts(key);
      if (rRev > lRev || (rRev === lRev && rTs > lTs)) {
        _set(key, remote.value); _setTs(key, rTs); _setRev(key, rRev);
      } else if (lRev > rRev || (lRev === rRev && lTs > rTs)) {
        const v = _get(key, null);
        if (v !== null && JSON.stringify(v) !== JSON.stringify(remote.value)) await fbSet(key, v);
      }
    }));
    if (!silent) toast('최신 상태예요');
  } catch (e) { if (!silent) toast('동기화하지 못했어요'); }
  finally { _syncing = false; }
}

/* ── 문제 데이터 ── */
const qdKey = (c, r) => 'qd::' + c + '::' + r;
const _b64u = (s) => btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const qdDocId = (c, r) => 'qd~' + _b64u(c) + '~' + _b64u(r);
const getIndex = () => { const i = _get('quiz_index', null); return (i && i.cats) ? i : { cats:{}, del:[] }; };
const getLegacy = () => _get('quiz_data', {});
function catList() { const c = Object.keys(getIndex().cats); return c.length ? c : Object.keys(getLegacy()); }
function roundList(c) {
  const idx = getIndex();
  return sortRounds(idx.cats[c] ? Object.keys(idx.cats[c]) : Object.keys(getLegacy()[c] || {}));
}
function roundCount(c, r) {
  const e = (getIndex().cats[c] || {})[r];
  return e ? (e.n || 0) : (((getLegacy()[c] || {})[r] || []).length);
}
function getRoundQs(c, r) {
  const v = _get(qdKey(c, r), null);
  if (Array.isArray(v)) return v;
  const l = (getLegacy()[c] || {})[r];
  return Array.isArray(l) ? l : [];
}
async function ensureRound(c, r) {
  if (getRoundQs(c, r).length) return true;
  if (!FIREBASE_OK) return false;
  try {
    const d = await withTimeout(db.collection('users').doc(USER_ID).collection('data').doc(qdDocId(c,r)).get(), FB_TIMEOUT);
    if (d.exists && Array.isArray(d.data().value)) { _set(qdKey(c,r), d.data().value); return true; }
  } catch (e) {}
  return false;
}
function sortRounds(a) {
  return a.slice().sort((x,y) => {
    const px = String(x).split('-'), py = String(y).split('-');
    for (let i = 0; i < Math.max(px.length, py.length); i++) {
      const nx = parseInt(px[i]||0,10), ny = parseInt(py[i]||0,10);
      if (!isNaN(nx) && !isNaN(ny) && nx !== ny) return nx - ny;
    }
    return String(x).localeCompare(String(y));
  });
}
const getProg = () => _get('quiz_progress', {});
const getWrong = () => _get('quiz_wrong', []);
const getStarred = () => _get('quiz_starred', {});
const getFlagged = () => _get('quiz_flagged', {});
const getHidden = () => _get('quiz_hidden', {});

/* ── 별표 · 체크 · 숨김 ── */
const qidOf = (q) => (q && (q.id || q.num)) || 0;
const markKey = (c, r, q) => c + '||' + r + '||' + qidOf(q);
function starLevel(c, r, q) {
  const e = getStarred()[markKey(c,r,q)];
  if (!e) return 0;
  const v = parseInt(e.level, 10);
  return (v >= 1 && v <= 5) ? v : 1;
}
function setStar(c, r, q, level) {
  const st = getStarred(), key = markKey(c,r,q), cur = starLevel(c,r,q);
  const next = (level === cur) ? 0 : level;
  if (next === 0) delete st[key];
  else st[key] = { cat:c, round:r, qId:qidOf(q), level:next, addedAt:(st[key]&&st[key].addedAt)||Date.now() };
  save('quiz_starred', st);
  return next;
}
const isFlagged = (c,r,q) => !!getFlagged()[markKey(c,r,q)];
function toggleFlag(c, r, q) {
  const f = getFlagged(), key = markKey(c,r,q);
  let on;
  if (f[key]) { delete f[key]; on = false; }
  else { f[key] = { cat:c, round:r, qId:qidOf(q), addedAt:Date.now() }; on = true; }
  save('quiz_flagged', f);
  return on;
}
const isHidden = (c,r,q) => !!getHidden()[markKey(c,r,q)];
function toggleHidden(c, r, q) {
  const h = getHidden(), key = markKey(c,r,q);
  let on;
  if (h[key]) { delete h[key]; on = false; }
  else { h[key] = { cat:c, round:r, qId:qidOf(q), addedAt:Date.now() }; on = true; }
  save('quiz_hidden', h);
  return on;
}
function visibleRound(c, r) {
  const all = getRoundQs(c, r), items = [], map = [];
  all.forEach((q, i) => { if (!isHidden(c, r, q)) { items.push(q); map.push(i); } });
  return { items, map };
}

/* ── 오답노트 ── 회차를 풀 때만 쌓고, 맞혔다고 지우지 않는다 (정식과 같은 규칙) */
function addWrong(c, r, q, myAnswer) {
  const id = c + '_' + r + '_' + qidOf(q);
  const list = getWrong().filter(w => w.id !== id);
  list.push({ id, cat:c, round:r, q, myAnswer, addedAt: Date.now() });
  save('quiz_wrong', list);
}

/* ── 계산문제 (정식과 같은 규칙: 해설이나 답에 = 가 있으면) ── */
const _EQ_RE = /[=＝]/;
function isCalcQ(q) {
  if (!q) return false;
  if (_EQ_RE.test(q.explanation || '')) return true;
  const opts = Array.isArray(q.options) ? q.options : [];
  const isSubj = q.type === 'subj' || opts.length === 0;
  return _EQ_RE.test(isSubj ? (q.answer || '') : (opts[q.correct] || ''));
}

/* ══ 지금 흘러오는 묶음 ══ */
let deck = null;   // { kind, label, items:[{q,cat,round}], idx, answered:{}, revealed:{}, map }
let _lastTap = 0;

/* [수정] esc 가 String() 이기만 했다. 보기 글·자격증 이름·문제 앞부분을 innerHTML 로
   넣는 자리가 있어서, 문제 본문에 `<` 같은 글자가 섞이면 화면이 깨지거나 그 안의 태그가
   그대로 살아난다(정식 화면은 escHtml 로 막고 있다). 같은 방식으로 맞춘다.
   escArg 는 onclick="…('여기')" 처럼 속성 안 문자열 자리에 쓴다 — 이름에 따옴표가
   들어가면 단추가 통째로 망가지기 때문이다. */
const esc = (v) => v == null ? '' : String(v)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const escArg = (v) => v == null ? '' : String(v)
  .replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;')
  .replace(/&(?!quot;|amp;|lt;|gt;|#)/g, '&amp;')
  .replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\r?\n/g, ' ');

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ── 묶음 만들기 ── */
function markedItems(kind) {
  const src = kind === 'star' ? getStarred() : getFlagged();
  const out = [];
  Object.keys(src).forEach(k => {
    const e = src[k] || {};
    if (!e.cat || !e.round) return;
    const q = getRoundQs(e.cat, e.round).find(x => String(qidOf(x)) === String(e.qId));
    if (!q || isHidden(e.cat, e.round, q)) return;
    out.push({ q, cat:e.cat, round:e.round, level: parseInt(e.level,10)||1, at: e.addedAt||0 });
  });
  if (kind === 'star') out.sort((a,b) => (b.level - a.level) || (b.at - a.at));
  else out.sort((a,b) => b.at - a.at);
  return out;
}
/* [수정] 오답이 하나도 안 나오던 원인.
   정식 화면은 오답 목록을 가볍게 하려고, 회차 원본에서 찾을 수 있는 항목의
   문제 사본(q)을 지우고 번호(qId)만 남긴다. 그런데 여기서는 사본이 있는 것만
   골라 쓰고 있어서, 정리가 한 번 돌고 나면 오답이 통째로 사라져 보였다.
   → 정식과 같은 방식으로 번호를 가지고 회차에서 찾고, 못 찾을 때만 사본을 쓴다. */
function _entryQId(w) {
  if (w.qId != null) return w.qId;
  return w.q ? (w.q.id || w.q.num) : undefined;
}
function resolveEntryQ(w) {
  const qId = _entryQId(w);
  if (qId != null) {
    const found = getRoundQs(w.cat, w.round)
      .find(x => String(x.id) === String(qId) || String(x.num) === String(qId));
    if (found) return found;
  }
  return w.q || null;      // 회차를 지웠거나 아직 안 받아왔으면 예전 사본이라도
}
function wrongDeckItems() {
  const out = [];
  getWrong().forEach(w => {
    const q = resolveEntryQ(w);
    if (q) out.push({ q, cat: w.cat, round: w.round });
  });
  return out;
}
// 오답이 가리키는 회차 중 이 기기에 없는 것 (문제 본문을 못 찾으니 받아와야 한다)
function _wrongMissingRounds() {
  const need = new Set();
  getWrong().forEach(w => {
    if (!w.cat || !w.round) return;
    if (resolveEntryQ(w)) return;
    if (!getRoundQs(w.cat, w.round).length) need.add(w.cat + '\u0000' + w.round);
  });
  return [...need];
}
function calcItems() {
  const out = [];
  catList().forEach(c => roundList(c).forEach(r => {
    visibleRound(c, r).items.forEach(q => { if (isCalcQ(q)) out.push({ q, cat:c, round:r }); });
  }));
  return out;
}

// 숫자만 세는 용도 (판을 그릴 때)
function counts() {
  return {
    wrong: getWrong().length,   // 회차를 아직 안 받아왔어도 개수는 그대로 보여준다
    star: Object.keys(getStarred()).length,
    flag: Object.keys(getFlagged()).length,
    calc: calcItems().length,
    mockwrong: mockWrongPool('').length,
  };
}

/* ══ 모의고사 ══
   [형식 계약] 기록·오답·'눈 돌리기' 진도 모두 정식 화면과 같은 곳에 같은 모양으로 쌓는다
   (mock_records · mock_wrong · mock_deck). 그래야 정식 화면의 모의고사 기록에 그대로 이어진다. */
const getMockRecords = () => { const v = _get('mock_records', []); return Array.isArray(v) ? v : []; };
const getMockWrongs  = () => { const v = _get('mock_wrong', []);   return Array.isArray(v) ? v : []; };
const getMockDeck    = () => { const v = _get('mock_deck', {});    return (v && typeof v === 'object') ? v : {}; };
const _deckKey = (round, num) => round + '||' + Number(num);

const MOCK_MODES = [
  { id: 'deck',   label: '눈 돌리기',   sub: '아직 안 본 문제에서만' },
  { id: 'random', label: '완전 무작위', sub: '이미 본 문제도 다시' },
  { id: 'wrong',  label: '오답에서만',  sub: '모의고사에서 틀렸던 것' },
];
// 지난번에 고른 방식·문항 수를 기억한다 (정식 화면과 같은 열쇠 · 이 기기 전용)
function getMockMode() {
  const m = (() => { try { return localStorage.getItem('mock_last_mode'); } catch (e) { return null; } })();
  return MOCK_MODES.some(x => x.id === m) ? m : 'deck';
}
function getLastMockCount() {
  const n = parseInt((() => { try { return localStorage.getItem('mock_last_count'); } catch (e) { return ''; } })() || '', 10);
  return (!isNaN(n) && n > 0) ? n : 60;
}

// 이 자격증에서 이번 바퀴에 이미 낸 문제 — 처음이면 지금까지의 기록에서 채운다(정식과 같은 규칙)
function getMockSeen(cat) {
  const d = getMockDeck();
  if (Array.isArray(d[cat])) return new Set(d[cat]);
  const seeded = new Set();
  getMockRecords().filter(r => r.cat === cat && (r.mode || 'deck') === 'deck')
    .flatMap(r => r.questionLog || [])
    .forEach(({ round, qNum }) => seeded.add(_deckKey(round, qNum)));
  d[cat] = [...seeded];
  save('mock_deck', d);
  return seeded;
}
function setMockSeen(cat, set) { const d = getMockDeck(); d[cat] = [...set]; save('mock_deck', d); }

// 모의고사 오답 통 — 같은 문제를 여러 번 틀렸으면 하나로 합치고, 지금 회차의 본문을 쓴다
function mockWrongPool(cat) {
  const seen = new Set(), pool = [];
  getMockWrongs().forEach(w => {
    if (!w || !w.q) return;
    if (cat && w.cat !== cat) return;
    if (isHidden(w.cat, w.round, w.q)) return;
    const k = w.cat + '␀' + _deckKey(w.round, w.q.num);
    if (seen.has(k)) return;
    seen.add(k);
    const live = getRoundQs(w.cat, w.round).find(x => Number(x.num) === Number(w.q.num));
    pool.push({ q: live || w.q, cat: w.cat, round: w.round });
  });
  return pool;
}

// 제대로 된 섞기 (sort(()=>Math.random()-.5) 는 한쪽으로 치우친다)
function _shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function mockPool(cat, mode) {
  if (mode === 'wrong') return mockWrongPool(cat);
  const pool = [];
  roundList(cat).forEach(r => visibleRound(cat, r).items.forEach(q => pool.push({ q, cat, round: r })));
  return pool;
}
function buildMock(cat, count, mode) {
  const pool = mockPool(cat, mode);
  if (!pool.length) return null;
  count = Math.max(1, Math.min(parseInt(count) || 60, pool.length));
  // 완전 무작위 · 오답에서만 — 통에서 그냥 뽑는다 (눈 돌리기 진도는 건드리지 않는다)
  if (mode !== 'deck') return _shuffle(pool.slice()).slice(0, count);

  const seen = getMockSeen(cat);
  // 아직 제출 안 하고 풀던 시험이 있으면 그 문제는 빼 둔다 (새 시험에 겹쳐 나오지 않게)
  const busy = new Set();
  const ms = loadMockSave();
  if (ms && ms.cat === cat) (ms.picks || []).forEach(p => busy.add(_deckKey(p.round, p.qNum)));

  let left = _shuffle(pool.filter(it => {
    const k = _deckKey(it.round, it.q.num);
    return !seen.has(k) && !busy.has(k);
  }));
  let result;
  if (left.length >= count) result = left.slice(0, count);
  else {
    // 남은 걸 다 써도 모자라면 한 바퀴 끝난 것 — 새로 섞어 이어 채운다
    result = left.slice();
    const used = new Set(result.map(it => _deckKey(it.round, it.q.num)));
    result = result.concat(_shuffle(pool.filter(it => !used.has(_deckKey(it.round, it.q.num))))
                          .slice(0, count - result.length));
    setMockSeen(cat, new Set());
    toast('전체 문제를 한 바퀴 다 봤어요 · 새로 섞어서 다시 시작합니다');
  }
  return result.length ? _shuffle(result) : null;
}

/* 아직 제출하지 않은 시험 (이 기기에만 남는다 — 새로고침해도 이어서 풀 수 있게) */
function loadMockSave() { try { return JSON.parse(localStorage.getItem('study_mock') || 'null'); } catch (e) { return null; } }
function saveMock() {
  if (!deck || deck.kind !== 'mock' || deck.done) return;
  try {
    localStorage.setItem('study_mock', JSON.stringify({
      cat: deck.cat, mode: deck.mode, startTime: deck.startTime, idx: deck.idx,
      answered: deck.answered, inputs: deck.inputs,
      picks: deck.items.map(it => ({ cat: it.cat, round: it.round, qNum: Number(it.q.num) })),
    }));
  } catch (e) {}
}
function clearMock() { try { localStorage.removeItem('study_mock'); } catch (e) {} }

/* ── 묶음 열기 ── */
async function openDeck(kind, cat, round, startIdx) {
  closeAll();
  let items = [], label = '', map = null, answered = {};

  if (kind === 'round') {
    if (!getRoundQs(cat, round).length) { showLoading('문제를 받아오는 중…'); await ensureRound(cat, round); }
    const v = visibleRound(cat, round);
    if (!v.items.length) { toast('이 회차는 볼 문제가 없어요'); hideLoading(); return; }
    items = v.items.map(q => ({ q, cat, round })); map = v.map;
    label = `<b>${esc(cat)}</b> · ${esc(round)}회차`;
    const p = getProg()[cat + '_' + round] || {}, saved = p.answered || {};
    map.forEach((oi, ni) => { if (oi in saved) answered[ni] = saved[oi]; });
    if (startIdx == null) {
      const at = map.indexOf(p.idx);
      if (at >= 0) startIdx = at;
      else { startIdx = 0; for (let i = 0; i < items.length; i++) if (!(i in answered)) { startIdx = i; break; } }
    }
  } else if (kind === 'wrong') {
    const need = _wrongMissingRounds();
    if (need.length) {
      showLoading(`오답이 있는 회차를 받아오는 중… (${need.length})`);
      for (const k of need) { const [c, r] = k.split('\u0000'); await ensureRound(c, r); }
    }
    items = wrongDeckItems(); label = '<b>오답</b>';
  } else if (kind === 'star')  { items = markedItems('star').map(x => ({ q:x.q, cat:x.cat, round:x.round })); label = '<b>별표</b>';
  } else if (kind === 'flag')  { items = markedItems('flag').map(x => ({ q:x.q, cat:x.cat, round:x.round })); label = '<b>체크</b>';
  } else if (kind === 'calc')  { items = calcItems(); label = '<b>계산문제</b>';
  } else if (kind === 'mockwrong') { items = mockWrongPool(''); label = '<b>모의고사 오답</b>'; }

  hideLoading();
  if (!items.length) {
    deck = null;
    showEmpty(kind === 'wrong' ? '오답이 없어요' : kind === 'star' ? '별표한 문제가 없어요'
            : kind === 'flag' ? '체크한 문제가 없어요'
            : kind === 'mockwrong' ? '모의고사 오답이 없어요' : '계산문제가 없어요',
            '위 알약을 눌러 다른 걸 골라보세요');
    setDial(label + ' · 0');
    return;
  }
  deck = { kind, label, items, map, idx: Math.min(startIdx || 0, items.length - 1), answered, revealed: {}, inputs: {} };
  hideResult();
  swapIn();
  saveSpot();
}

/* ── 모의고사 시작 ── */
function startMock(cat, count, mode) {
  closeAll();
  const built = buildMock(cat, count, mode);
  if (!built) { toast(mode === 'wrong' ? '이 자격증은 모의고사 오답이 아직 없어요' : '낼 문제가 없어요'); return; }
  if (built.length < count) toast(`문제가 부족해서 ${built.length}문제로 만들었어요`);
  try {
    localStorage.setItem('mock_last_count', String(count));
    localStorage.setItem('mock_last_mode', mode);
  } catch (e) {}
  deck = {
    kind: 'mock', cat, mode, items: built, idx: 0, answered: {}, revealed: {}, inputs: {},
    startTime: Date.now(), done: false,
    label: `<b>${esc(cat)}</b> · ${mode === 'wrong' ? '오답 모의고사' : '모의고사'}`,
  };
  clearMock(); saveMock();
  hideResult();
  swapIn();
}
function mockAgain() {
  if (!deck || deck.kind !== 'mock') return;
  startMock(deck.cat, deck.items.length, deck.mode);
}

/* ── 제출 · 채점 ──
   [주의] 안 푼 문제가 있으면 채점하지 않고 그 문항으로 데려간다 — 정식 화면과 같은 규칙이다.
   (안 푼 것을 직접 찾아다니는 게 번거로워서 그렇게 정했다. 필답형은 O·X 를 누르지 않았으면 안 푼 것으로 본다) */
function firstUnansweredIdx() {
  if (!deck) return -1;
  for (let i = 0; i < deck.items.length; i++) if (!(i in deck.answered)) return i;
  return -1;
}
function submitMock() {
  if (!deck || deck.kind !== 'mock') return;
  if (deck.done) { showResult(); return; }
  const gap = firstUnansweredIdx();
  if (gap >= 0) {
    deck.idx = gap; hideResult(); render();
    toast(`아직 안 푼 문제가 ${deck.items.length - Object.keys(deck.answered).length}개 있어요`);
    return;
  }
  gradeMock();
}
function gradeMock() {
  const { items, answered, cat } = deck;
  const mode = deck.mode || 'deck';
  const wrongItems = [];
  let correct = 0;
  items.forEach((it, i) => {
    const q = it.q, chosen = answered[i];
    const opts = Array.isArray(q.options) ? q.options : [];
    const isSubj = q.type === 'subj' || opts.length === 0;
    if (isSubj) {
      if (chosen === 'correct') correct++;
      else if (chosen === 'wrong') wrongItems.push({ i, cat: it.cat, round: it.round, q, myAnswer: 'wrong' });
    } else if (chosen === q.correct) correct++;
    else wrongItems.push({ i, cat: it.cat, round: it.round, q, myAnswer: chosen !== undefined ? chosen : -1 });
  });

  const total = items.length;
  const pct = Math.round(correct / total * 100);
  const el = Math.floor((Date.now() - (deck.startTime || Date.now())) / 1000);
  const timeUsed = `${Math.floor(el / 60)}분 ${el % 60}초`;
  const recordId = Date.now();

  const records = getMockRecords();
  records.push({ id: recordId, cat, mode, date: recordId, correct, total, pct, timeUsed,
                 wrongCount: wrongItems.length,
                 questionLog: items.map(it => ({ round: it.round, qNum: Number(it.q.num) })) });
  save('mock_records', records);

  // '눈 돌리기' 진도는 실제로 제출한 시험만 친다 (무작위·오답 모의고사는 건드리지 않는다)
  if (mode === 'deck') {
    const seen = getMockSeen(cat);
    items.forEach(it => seen.add(_deckKey(it.round, it.q.num)));
    setMockSeen(cat, seen);
  }

  const mw = getMockWrongs();
  wrongItems.forEach(w => {
    mw.push({ id: `mock_${recordId}_${w.cat}_${w.round}_${w.q.num}`, cat: w.cat, round: w.round,
              q: w.q, myAnswer: w.myAnswer, mockId: recordId, addedAt: Date.now() });
  });
  save('mock_wrong', mw);

  deck.done = true;
  deck.result = { correct, total, pct, timeUsed, wrong: wrongItems.map(w => ({ i: w.i, round: w.round, q: w.q })) };
  clearMock();
  showResult();
}

/* ── 결과 ── */
function showResult() {
  if (!deck || !deck.result) return;
  const r = deck.result, pass = r.pct >= 60;
  const rows = r.wrong.map(w => {
    const t = String(w.q.question || '').replace(/\s+/g, ' ').slice(0, 46);
    return `<button class="res-row" onclick="mockGoTo(${w.i})">
      <span class="rq">Q ${w.i + 1}</span><span class="rt">${esc(t)}</span>
      <span class="rr">${esc(w.round)}</span></button>`;
  }).join('');
  document.getElementById('res').innerHTML = `
    <div class="res-in">
      <div class="res-where">${esc(deck.cat)} ${deck.mode === 'wrong' ? '오답 모의고사' : '모의고사'} · ${pass ? '합격' : '불합격'}</div>
      <div class="res-big" style="color:${pass ? 'var(--ok)' : 'var(--no)'}">${r.pct}<small>점</small></div>
      <div class="res-line">${r.total}문항 중 <b>${r.correct}개</b> 정답 · 틀림 ${r.total - r.correct}개 · ${esc(r.timeUsed)}</div>
      <div class="res-acts">
        <button class="glass" onclick="mockAgain()">한 번 더</button>
        <button class="glass" onclick="mockReviewWrong()">틀린 것만 보기</button>
        <button class="glass" onclick="mockExit()">나가기</button>
      </div>
      ${r.wrong.length
        ? `<div class="res-label">틀린 문제 ${r.wrong.length}개 · 누르면 그 문제로 갑니다</div>${rows}`
        : `<div class="res-label">모두 맞혔어요</div>`}
    </div>`;
  document.getElementById('res').classList.add('show');
  document.body.classList.add('result');
  document.getElementById('empty').classList.remove('show');
  setDial(deck.label + ' · 결과');
  paintSubmit();
}
function hideResult() {
  document.getElementById('res').classList.remove('show');
  document.body.classList.remove('result');
}
function mockGoTo(i) {
  if (!deck) return;
  hideResult();
  deck.idx = Math.max(0, Math.min(deck.items.length - 1, i));
  deck.revealed[deck.idx] = true;      // 채점이 끝났으니 정답·해설을 펼친 채로 보여준다
  render();
}
// 방금 시험에서 틀린 것만 다시 — 이건 시험이 아니라 그냥 훑어보는 묶음이다
function mockReviewWrong() {
  if (!deck || !deck.result || !deck.result.wrong.length) return;
  const items = deck.result.wrong.map(w => ({ q: w.q, cat: deck.cat, round: w.round }));
  const label = '<b>방금 시험 오답</b>';
  deck = { kind: 'mockreview', label, items, map: null, idx: 0, answered: {}, revealed: {}, inputs: {} };
  hideResult();
  swapIn();
}
function mockExit() {
  hideResult();
  deck = null;
  const bms = (() => { const v = _get('resume_bookmark', []); return Array.isArray(v) ? v : (v ? [v] : []); })();
  const bm = bms.length ? bms[bms.length - 1] : null;
  if (bm && bm.cat && roundCount(bm.cat, bm.round)) { openDeck('round', bm.cat, bm.round); return; }
  const c = catList().filter(x => roundList(x).length)[0];
  if (c) openDeck('round', c, roundList(c)[0]);
  else showEmpty('등록된 문제가 없어요', '정식 화면에서 문제를 추가하세요');
}

/* 아직 제출 안 한 시험 되살리기 */
async function resumeMock(ms) {
  showLoading('풀던 모의고사를 불러오는 중…');
  const need = new Set();
  (ms.picks || []).forEach(p => { if (!getRoundQs(p.cat, p.round).length) need.add(p.cat + '␀' + p.round); });
  for (const k of need) { const [c, r] = k.split('␀'); await ensureRound(c, r); }
  const items = [];
  const keep = {};
  (ms.picks || []).forEach((p, i) => {
    const q = getRoundQs(p.cat, p.round).find(x => Number(x.num) === Number(p.qNum));
    if (!q) return;                                  // 그 사이 지워진 문제는 빼고 이어 푼다
    if (i in (ms.answered || {})) keep[items.length] = ms.answered[i];
    items.push({ q, cat: p.cat, round: p.round });
  });
  hideLoading();
  if (!items.length) { clearMock(); return false; }
  deck = {
    kind: 'mock', cat: ms.cat, mode: ms.mode || 'deck', items, idx: Math.min(ms.idx || 0, items.length - 1),
    answered: keep, revealed: {}, inputs: ms.inputs || {}, startTime: ms.startTime || Date.now(), done: false,
    label: `<b>${esc(ms.cat)}</b> · ${ms.mode === 'wrong' ? '오답 모의고사' : '모의고사'}`,
  };
  hideResult();
  swapIn();
  return true;
}

/* ── 문제 그림 ──
   [형식 계약] 그림도 정식 화면과 같은 저장소를 쓴다. 문제의 그림은 q.imgId,
   해설의 그림은 q.expImgId 이고, 그림 자체는 이 기기의 IndexedDB('yjnote-img'/'imgs'),
   서버에는 문서 'quiz_img_<id>' 에 들어 있다. 여기서는 읽기만 한다 — 올리고 지우는 일은
   정식 화면 몫이다. (예전엔 q.image 라는 없는 자리를 보고 있어서 작업형 그림이 안 나왔다) */
const QIMG_DB = 'yjnote-img', QIMG_STORE = 'imgs';
let _qimgDbP = null;
function qImgDB() {
  if (_qimgDbP) return _qimgDbP;
  _qimgDbP = new Promise((res, rej) => {
    if (!window.indexedDB) { rej(new Error('IndexedDB 없음')); return; }
    const rq = indexedDB.open(QIMG_DB, 1);
    rq.onupgradeneeded = () => {
      const d = rq.result;
      if (!d.objectStoreNames.contains(QIMG_STORE)) d.createObjectStore(QIMG_STORE);
    };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
  return _qimgDbP;
}
function _idbImg(mode, fn) {
  return qImgDB().then(d => new Promise((res, rej) => {
    const tx = d.transaction(QIMG_STORE, mode);
    let out;
    const r = fn(tx.objectStore(QIMG_STORE));
    if (r) r.onsuccess = () => { out = r.result; };
    tx.oncomplete = () => res(out);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  }));
}
const idbGetImg = (id) => _idbImg('readonly', st => st.get(id)).catch(() => null);
const idbPutImg = (id, v) => _idbImg('readwrite', st => st.put(v, id)).catch(() => null);

// 방금 본 그림 몇 장만 메모리에 둔다 — 문제를 앞뒤로 넘길 때 다시 불러오지 않게
const _imgMem = new Map(), IMG_MEM_MAX = 24;
function _memGet(id) {
  if (!_imgMem.has(id)) return null;
  const v = _imgMem.get(id); _imgMem.delete(id); _imgMem.set(id, v); return v;
}
function _memPut(id, v) {
  if (_imgMem.has(id)) _imgMem.delete(id);
  _imgMem.set(id, v);
  while (_imgMem.size > IMG_MEM_MAX) _imgMem.delete(_imgMem.keys().next().value);
}

// 그림 한 장 : 메모리 → 이 기기(IndexedDB) → 서버 순서. 서버에서 받은 것은 기기에도 남긴다
const _imgFetching = {};
function loadQImg(id) {
  if (!id) return Promise.resolve(null);
  const mem = _memGet(id);
  if (mem) return Promise.resolve(mem);
  if (_imgFetching[id]) return _imgFetching[id];
  _imgFetching[id] = (async () => {
    try {
      const local = await idbGetImg(id);
      if (local) { _memPut(id, local); return local; }
      if (!FIREBASE_OK) return null;
      const remote = await fbGet('quiz_img_' + id);
      if (remote && remote.value) { _memPut(id, remote.value); idbPutImg(id, remote.value); return remote.value; }
      return null;
    } catch (e) { return null; }
    finally { delete _imgFetching[id]; }
  })();
  return _imgFetching[id];
}

// 그림 칸의 자리 — 폰은 화면 위(스크롤해도 안 움직임), 넓은 화면은 문제 바로 아래
function placeImgWrap() {
  const wrap = document.getElementById('imgwrap');
  const home = document.getElementById(isWide() ? 'imgslot' : 'imgdock');
  if (wrap && home && wrap.parentElement !== home) home.appendChild(wrap);
}
window.addEventListener('resize', placeImgWrap);

// [주의] 다른 기기에서 방금 올린 그림은 서버에 닿기까지 몇 초 걸린다.
//        한 번 실패했다고 포기하지 않고 2.5초 → 6초 → 15초 뒤에 스스로 다시 시도한다.
const _QIMG_RETRY_MS = [2500, 6000, 15000];
function paintQImg(q) {
  const wrap = document.getElementById('imgwrap');
  const img = document.getElementById('qimg'), msg = document.getElementById('imgmsg');
  const id = (q && q.imgId) || '';
  placeImgWrap();
  wrap.dataset.imgId = id;
  document.body.classList.toggle('has-img', !!id);
  if (!id) {
    wrap.classList.remove('show'); msg.classList.remove('show');
    img.style.display = 'none'; img.removeAttribute('src');
    return;
  }
  wrap.classList.add('show');
  _paintImgFold(isImgOpen());
  const mem = _memGet(id);
  if (mem) { _showQImg(mem); return; }
  img.style.display = 'none'; img.removeAttribute('src');
  msg.textContent = '그림을 불러오는 중…'; msg.classList.add('show');
  _tryQImg(id, 0);
}
function _showQImg(data) {
  const img = document.getElementById('qimg'), msg = document.getElementById('imgmsg');
  img.src = data; img.style.display = 'block';
  msg.classList.remove('show'); msg.textContent = '';
}
function _tryQImg(id, n) {
  loadQImg(id).then(v => {
    const wrap = document.getElementById('imgwrap');
    if (wrap.dataset.imgId !== id) return;      // 그 사이 다른 문제로 넘어갔으면 버린다
    if (v) { _showQImg(v); return; }
    if (n < _QIMG_RETRY_MS.length) {
      setTimeout(() => { if (wrap.dataset.imgId === id) _tryQImg(id, n + 1); }, _QIMG_RETRY_MS[n]);
      return;
    }
    const msg = document.getElementById('imgmsg');
    msg.innerHTML = '그림을 불러오지 못했어요 <button onclick="retryQImg()">다시 시도</button>';
    msg.classList.add('show');
  });
}
function retryQImg() {
  const id = document.getElementById('imgwrap').dataset.imgId;
  if (!id) return;
  const msg = document.getElementById('imgmsg');
  msg.textContent = '그림을 불러오는 중…'; msg.classList.add('show');
  _tryQImg(id, 0);
}

/* [수정] 그림은 접힌 채로 시작한다 — 문제부터 읽고 필요할 때 펴는 쪽이 편하다고 해서.
   펴 둔 상태는 다음 문제·다음 실행에도 이어진다.
   열쇠를 정식 화면('qimg_open')과 따로 두는 이유: 두 화면은 기본값이 서로 다르다
   (정식은 펴진 채로 시작). 같이 쓰면 한쪽에서 접은 것이 다른 쪽까지 바꾼다.
   이 기기에만 남고 서버로 가지 않는다. */
function isImgOpen() { try { return localStorage.getItem('study_qimg_open') === '1'; } catch (e) { return false; } }
function _paintImgFold(open) {
  document.getElementById('imgwrap').classList.toggle('fold', !open);
  document.getElementById('imgfold').textContent = open ? '접기' : '펴기';
  document.getElementById('imgcap').textContent = open ? '그림 · 눌러서 크게' : '그림 1장 · 눌러서 펴기';
}
function toggleImgFold() {
  const open = !isImgOpen();
  try { localStorage.setItem('study_qimg_open', open ? '1' : '0'); } catch (e) {}
  _paintImgFold(open);
}

// 해설 그림 — 정답을 본 뒤 해설 글 아래에 붙는다
function paintExpImg(q, shown) {
  const box = document.getElementById('expimg');
  const id = (shown && q && q.expImgId) || '';
  box.dataset.imgId = id;
  if (!id) { box.innerHTML = ''; return; }
  const pic = (src) => `<img src="${src}" alt="해설 그림" onclick="openLightbox(this.src)">`;
  const mem = _memGet(id);
  if (mem) { box.innerHTML = pic(mem); return; }
  box.innerHTML = '<div class="eimg-msg">그림을 불러오는 중…</div>';
  loadQImg(id).then(v => {
    if (box.dataset.imgId !== id) return;
    box.innerHTML = v ? pic(v) : '<div class="eimg-msg">해설 그림을 불러오지 못했어요</div>';
  });
}

/* ── 그림 크게 보기 (도면은 확대해서 봐야 한다) ── */
let _lbS = 1, _lbX = 0, _lbY = 0;
const lbOpen = () => document.getElementById('lb').classList.contains('show');
function _lbApply() {
  const i = document.getElementById('lb-img');
  i.style.transform = `translate(${_lbX}px,${_lbY}px) scale(${_lbS})`;
  i.style.cursor = _lbS > 1 ? 'grab' : 'zoom-in';
}
function openLightbox(src) {
  const s = src || document.getElementById('qimg').getAttribute('src');
  if (!s) return;
  document.getElementById('lb-img').src = s;
  _lbS = 1; _lbX = 0; _lbY = 0; _lbApply();
  document.getElementById('lb').classList.add('show');
}
function closeLightbox() {
  document.getElementById('lb').classList.remove('show');
  document.getElementById('lb-img').removeAttribute('src');
}
(function bindLightbox() {
  const lb = document.getElementById('lb'), im = document.getElementById('lb-img');
  const pts = new Map();
  let base = 1, d0 = 0, sx = 0, sy = 0, moved = false;
  im.addEventListener('pointerdown', (e) => {
    try { im.setPointerCapture(e.pointerId); } catch (_) {}
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    moved = false;
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      d0 = Math.hypot(a.x - b.x, a.y - b.y); base = _lbS;
    } else { sx = e.clientX - _lbX; sy = e.clientY - _lbY; }
    e.preventDefault();
  });
  im.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size >= 2) {                       // 두 손가락 — 넓혀서 확대
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d0) {
        _lbS = Math.max(1, Math.min(5, base * d / d0));
        if (_lbS === 1) { _lbX = 0; _lbY = 0; }
        _lbApply(); moved = true;
      }
      return;
    }
    if (_lbS > 1) { _lbX = e.clientX - sx; _lbY = e.clientY - sy; moved = true; _lbApply(); }
  });
  const end = (e) => {
    pts.delete(e.pointerId);
    if (pts.size < 2) d0 = 0;
    if (pts.size === 1) { const p = [...pts.values()][0]; sx = p.x - _lbX; sy = p.y - _lbY; }
  };
  ['pointerup','pointercancel','pointerleave'].forEach(ev => im.addEventListener(ev, end));
  // 그림을 누르면 두 배 / 다시 누르면 원래대로 (끌던 중이었다면 무시)
  im.addEventListener('click', (e) => {
    e.stopPropagation();
    if (moved) return;
    _lbS = _lbS > 1 ? 1 : 2.2;
    if (_lbS === 1) { _lbX = 0; _lbY = 0; }
    _lbApply();
  });
  lb.addEventListener('click', () => closeLightbox());
  lb.addEventListener('wheel', (e) => {
    if (!lbOpen()) return;
    e.preventDefault();
    _lbS = Math.max(1, Math.min(5, _lbS * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
    if (_lbS === 1) { _lbX = 0; _lbY = 0; }
    _lbApply();
  }, { passive: false });
})();

/* ── 그리기 ── */
function setDial(html) { document.getElementById('dial-t').innerHTML = html; }

function showEmpty(big, sub) {
  hideResult();
  document.body.classList.remove('mock');
  const el = document.getElementById('empty');
  el.innerHTML = `<div class="big">${esc(big)}</div><div>${esc(sub || '')}</div>`;
  el.classList.add('show');
  document.getElementById('scroll').style.visibility = 'hidden';
  // 폰에서는 그림 칸이 스크롤 밖(화면 위)에 있어서 따로 감춰야 한다
  document.getElementById('imgwrap').classList.remove('show');
  document.body.classList.remove('has-img');
  document.getElementById('bar-i').style.width = '0';
  document.getElementById('prev').disabled = true;
  document.getElementById('next').disabled = true;
}
function hideEmpty() {
  document.getElementById('empty').classList.remove('show');
  document.getElementById('scroll').style.visibility = '';
}
function showLoading(msg) { showEmpty(msg, ''); }
function hideLoading() { hideEmpty(); }

function swapIn() {
  const st = document.getElementById('stage');
  st.classList.add('swap');
  setTimeout(() => { render(); st.classList.remove('swap'); }, 150);
}

function paintSubmit() {
  const b = document.getElementById('submit');
  document.body.classList.toggle('mock', !!(deck && deck.kind === 'mock'));
  if (!deck || deck.kind !== 'mock') return;
  b.textContent = deck.done ? '결과' : `제출 ${Object.keys(deck.answered).length}/${deck.items.length}`;
}

function render() {
  if (!deck) return;
  hideEmpty();
  paintSubmit();
  const it = deck.items[deck.idx], q = it.q;
  const opts = Array.isArray(q.options) ? q.options : [];
  const isSubj = q.type === 'subj' || opts.length === 0;
  const ans = deck.answered[deck.idx];
  const done = (deck.idx in deck.answered);
  const shown = deck.revealed[deck.idx] || (!isSubj && done);

  setDial(`${deck.label} · ${deck.idx + 1}/${deck.items.length}`);

  document.getElementById('qnum').textContent =
    'Q ' + (q.num != null ? q.num : deck.idx + 1) +
    (deck.kind !== 'round' ? `   ${it.cat} ${it.round}회차` : '');
  document.getElementById('qtext').textContent = q.question || '';

  paintQImg(q);

  const ops = document.getElementById('ops');
  const sw = document.getElementById('subjwrap');
  if (isSubj) {
    ops.innerHTML = ''; ops.style.display = 'none'; sw.style.display = 'block';
    const ta = document.getElementById('subj');
    ta.value = deck.inputs[deck.idx] || '';
    ta.oninput = () => { deck.inputs[deck.idx] = ta.value; };
    document.getElementById('j-ok').className = ans === 'correct' ? 'on-ok' : '';
    document.getElementById('j-no').className = ans === 'wrong' ? 'on-no' : '';
    document.getElementById('j-see').className = deck.revealed[deck.idx] ? 'on' : '';
  } else {
    sw.style.display = 'none'; ops.style.display = 'flex';
    ops.innerHTML = opts.map((o, i) => {
      let cls = '';
      if (shown) { if (i === q.correct) cls = ' ok'; else if (ans === i) cls = ' bad'; }
      else if (ans === i) cls = ' pick';
      return `<button class="op${cls}" onclick="pick(${i})"><span class="no">${i+1}</span><span>${esc(o)}</span></button>`;
    }).join('');
  }

  const exp = document.getElementById('exp');
  const body = isSubj
    ? [q.answer ? '정답: ' + q.answer : '', q.explanation || ''].filter(Boolean).join('\n\n')
    : (q.explanation || '');
  // 해설 글이 없어도 해설 그림만 있는 문제가 있다 — 그때도 해설 칸을 연다
  const openExp = !!(shown && (body || q.expImgId));
  document.getElementById('exp-b').textContent = body;
  exp.classList.toggle('show', openExp);
  paintExpImg(q, openExp);

  const pct = deck.items.length > 1 ? (deck.idx / (deck.items.length - 1) * 100) : 100;
  document.getElementById('bar-i').style.width = pct + '%';
  document.getElementById('bar-h').style.left = pct + '%';
  document.getElementById('prev').disabled = deck.idx === 0;
  document.getElementById('next').disabled = deck.idx >= deck.items.length - 1;
  paintTool();
  document.getElementById('scroll').scrollTop = 0;
}

function paintTool() {
  if (!deck) return;
  const it = deck.items[deck.idx];
  const lv = starLevel(it.cat, it.round, it.q);
  document.getElementById('stars').innerHTML =
    [1,2,3,4,5].map(i => `<button class="${i <= lv ? 'on' : ''}" onclick="tapStar(${i})">★</button>`).join('');
  document.getElementById('t-flag').classList.toggle('on', isFlagged(it.cat, it.round, it.q));
}

/* ── 답하기 ── */
function pick(i) {
  if (!deck || (deck.idx in deck.answered)) return;
  const it = deck.items[deck.idx], q = it.q;
  deck.answered[deck.idx] = i;
  if (deck.kind === 'round') {
    if (i !== q.correct) addWrong(it.cat, it.round, q, i);
    saveProgress();
  }
  // 모의고사는 오답노트를 건드리지 않는다 — 채점할 때 모의고사 오답으로만 쌓인다 (정식과 같은 규칙)
  if (deck.kind === 'mock') saveMock();
  render();
}
function judge(r) {
  if (!deck) return;
  const it = deck.items[deck.idx], q = it.q;
  const last = deck.idx >= deck.items.length - 1;
  deck.answered[deck.idx] = r;
  if (deck.kind === 'round') {
    if (r === 'wrong') addWrong(it.cat, it.round, q, -1);
    saveProgress();
  }
  if (deck.kind === 'mock') saveMock();
  render();
  // 판정하면 바로 다음 문항으로. 마지막에서는 넘기지 않는다(넘길 곳이 없다).
  // 눌린 것이 잠깐 보이고 넘어가야 내가 뭘 눌렀는지 알 수 있다.
  if (!last) setTimeout(() => { if (deck) move(1); }, 260);
}
function toggleAnswer() { if (!deck) return; deck.revealed[deck.idx] = !deck.revealed[deck.idx]; render(); }

function move(d) {
  if (!deck) return;
  if (document.body.classList.contains('result')) return;   // 결과를 보는 중에는 문항이 넘어가지 않게
  const n = deck.idx + d;
  if (n < 0 || n >= deck.items.length) return;
  deck.idx = n;
  if (deck.kind === 'round') saveProgress();
  if (deck.kind === 'mock') saveMock();
  saveSpot();
  render();
}

/* 진도는 '원래 문항 자리' 기준으로 쓴다 — 숨긴 문제의 예전 기록은 건드리지 않는다 */
function saveProgress() {
  if (!deck || deck.kind !== 'round' || !deck.map) return;
  const it = deck.items[deck.idx];
  const p = getProg(), key = it.cat + '_' + it.round;
  const keep = { ...((p[key] && p[key].answered) || {}) };
  deck.map.forEach(oi => { delete keep[oi]; });
  Object.keys(deck.answered).forEach(ni => { keep[deck.map[ni]] = deck.answered[ni]; });
  p[key] = { answered: keep, at: Date.now(), idx: deck.map[deck.idx] };
  save('quiz_progress', p);
  save('resume_bookmark', [{ id:'study', cat:it.cat, round:it.round, qIndex: deck.map[deck.idx],
                             qNum: it.q.num || (deck.idx + 1), savedAt: Date.now(), auto: true }]);
}

/* ── 도구 ── */
function tapStar(i) {
  const it = deck.items[deck.idx];
  const lv = setStar(it.cat, it.round, it.q, i);
  paintTool();
  toast(lv ? '★'.repeat(lv) : '별표 해제');
}
function tapFlag() {
  const it = deck.items[deck.idx];
  const on = toggleFlag(it.cat, it.round, it.q);
  paintTool();
  toast(on ? '체크 표시' : '체크 해제');
}
function tapHide() {
  const it = deck.items[deck.idx];
  toggleHidden(it.cat, it.round, it.q);
  toast('이 문제를 숨겼어요');
  closeAll();
  // 숨긴 문제는 지금 묶음에서도 빠진다
  deck.items.splice(deck.idx, 1);
  if (deck.map) deck.map.splice(deck.idx, 1);
  const na = {};
  Object.keys(deck.answered).forEach(k => {
    const i = +k; if (i < deck.idx) na[i] = deck.answered[k]; else if (i > deck.idx) na[i-1] = deck.answered[k];
  });
  deck.answered = na;
  if (!deck.items.length) { deck = null; showEmpty('남은 문제가 없어요', '위 알약을 눌러 다른 걸 골라보세요'); return; }
  if (deck.idx >= deck.items.length) deck.idx = deck.items.length - 1;
  render();
}

/* ── 판 열고 닫기 ── */
function openTool() {
  if (!deck) return;
  paintTool();
  document.getElementById('tool').classList.add('show');
  document.getElementById('scrim').classList.add('show');
  if (!isWide()) document.getElementById('stage').classList.add('pushed');
  if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
}
const isWide = () => window.matchMedia('(min-width:900px)').matches;

function toggleSheet() {
  const s = document.getElementById('sheet');
  if (s.classList.contains('show')) { closeAll(); return; }
  renderSheet();
  s.classList.add('show');
  document.body.classList.add('sheet-open');
  document.getElementById('scrim').classList.add('show');
  document.getElementById('dial').classList.add('open');
  document.getElementById('stage').classList.add('pushed');
}
function closeAll() {
  document.body.classList.remove('sheet-open');
  document.getElementById('sheet').classList.remove('show');
  document.getElementById('tool').classList.remove('show');
  document.getElementById('scrim').classList.remove('show');
  document.getElementById('dial').classList.remove('open');
  document.getElementById('stage').classList.remove('pushed');
}

function renderSheet() {
  const c = counts();
  const bms = (() => { const v = _get('resume_bookmark', []); return Array.isArray(v) ? v : (v ? [v] : []); })();
  const bm = bms.length ? bms[bms.length - 1] : null;
  const rows = [];
  if (bm && bm.cat && roundCount(bm.cat, bm.round)) {
    rows.push(`<button class="srow${deck && deck.kind === 'round' ? ' on' : ''}"
      onclick="openDeck('round','${escArg(bm.cat)}','${escArg(bm.round)}')">
      <span class="dot"></span>이어서 풀기<span class="n">${esc(bm.cat)} ${esc(bm.round)}</span></button>`);
    rows.push('<div class="sdiv"></div>');
  }
  const mk = (kind, label, n) => `<button class="srow${deck && deck.kind === kind ? ' on' : ''}"
      onclick="openDeck('${kind}')"><span class="dot"></span>${label}<span class="n">${n}</span></button>`;
  rows.push(mk('wrong', '오답', c.wrong));
  rows.push(mk('star', '별표', c.star));
  rows.push(mk('flag', '체크', c.flag));
  rows.push(mk('calc', '계산문제', c.calc));
  rows.push('<div class="sdiv"></div>');
  rows.push(`<button class="srow" onclick="openPicker()"><span class="dot"></span>회차 고르기<span class="n">→</span></button>`);
  rows.push(`<button class="srow${deck && deck.kind === 'mock' ? ' on' : ''}"
    onclick="openMockSheet()"><span class="dot"></span>모의고사<span class="n">→</span></button>`);
  rows.push(mk('mockwrong', '모의고사 오답', c.mockwrong));
  document.getElementById('sheet').innerHTML = rows.join('');
}

/* 모의고사 판 — 방식과 문항 수를 한 판에서 고르고, 문항 수를 누르면 바로 시작한다 */
function openMockSheet(cat) {
  const cats = catList().filter(c => roundList(c).length || mockWrongPool(c).length);
  if (!cats.length) { toast('등록된 문제가 없어요'); return; }
  if (!cat && cats.length === 1) cat = cats[0];
  const rows = [`<button class="srow" onclick="renderSheet()"><span class="dot"></span>← 뒤로</button>`,
                '<div class="sdiv"></div>'];
  if (!cat) {
    cats.forEach(c => rows.push(`<button class="srow" onclick="openMockSheet('${escArg(c)}')">
      <span class="dot"></span>${esc(c)}<span class="n">모의고사 →</span></button>`));
    document.getElementById('sheet').innerHTML = rows.join('');
    return;
  }
  const mode = getMockMode();
  const ms = loadMockSave();
  if (ms && ms.cat === cat && (ms.picks || []).length) {
    const doneN = Object.keys(ms.answered || {}).length;
    rows.push(`<button class="srow on" onclick="resumeMockSave()">
      <span class="dot"></span>풀던 시험 이어서<span class="n">${doneN}/${ms.picks.length}</span></button>`);
    rows.push('<div class="sdiv"></div>');
  }
  if (cats.length > 1) rows.push(`<button class="srow" onclick="openMockSheet()"><span class="dot"></span>← ${esc(cat)}</button>`);
  rows.push('<div class="slab">출제 방식</div>');
  MOCK_MODES.forEach(m => rows.push(`<button class="srow${mode === m.id ? ' on' : ''}"
    onclick="setMockMode('${m.id}','${escArg(cat)}')"><span class="dot"></span>${m.label}<span class="n">${m.sub}</span></button>`));

  // 낼 수 있는 문제가 몇 개인지 먼저 알려 준다 (방식마다 통이 다르다)
  const pool = mockPool(cat, mode).length;
  let hint;
  if (!pool) hint = mode === 'wrong' ? '이 자격증은 모의고사 오답이 아직 없어요' : '낼 문제가 없어요';
  else if (mode === 'wrong') hint = `모의고사 오답 <b>${pool}개</b>에서 뽑아요`;
  else if (mode === 'random') hint = `전체 <b>${pool}문제</b>에서 매번 새로 뽑아요`;
  else {
    const seen = getMockSeen(cat).size;
    hint = `전체 ${pool}문제 중 <b>${Math.min(seen, pool)}개</b>를 봤어요 · 남은 ${Math.max(0, pool - seen)}개에서 겹치지 않게 냅니다`;
  }
  rows.push(`<div class="shint">${hint}</div>`);

  if (pool) {
    rows.push('<div class="slab">문항 수</div>');
    const last = getLastMockCount();
    const opts = [...new Set([10, 20, 40, 60, 100, last].filter(n => n > 0 && n <= pool))].sort((a, b) => a - b);
    if (!opts.length) opts.push(pool);
    else if (opts[opts.length - 1] < pool) opts.push(pool);       // 통을 다 쓰는 선택지도 하나
    opts.forEach(n => rows.push(`<button class="srow${n === last ? ' on' : ''}"
      onclick="startMock('${escArg(cat)}',${n},'${mode}')">
      <span class="dot"></span>${n}문항<span class="n">${n === pool ? '전부 · 시작 →' : '시작 →'}</span></button>`));
  }
  document.getElementById('sheet').innerHTML = rows.join('');
}
function setMockMode(m, cat) {
  try { localStorage.setItem('mock_last_mode', m); } catch (e) {}
  openMockSheet(cat);
}
async function resumeMockSave() {
  const ms = loadMockSave();
  closeAll();
  if (!ms || !(await resumeMock(ms))) toast('풀던 시험을 되살리지 못했어요');
}

/* 회차 고르기 — 같은 판 안에서 한 겹 들어간다 */
function openPicker(cat) {
  const cats = catList().filter(c => roundList(c).length);
  if (!cats.length) { toast('등록된 문제가 없어요'); return; }
  if (!cat && cats.length === 1) cat = cats[0];
  const rows = [`<button class="srow" onclick="renderSheet()"><span class="dot"></span>← 뒤로</button>`,
                '<div class="sdiv"></div>'];
  if (!cat) {
    cats.forEach(c => rows.push(`<button class="srow" onclick="openPicker('${escArg(c)}')">
      <span class="dot"></span>${esc(c)}<span class="n">${roundList(c).length}회차</span></button>`));
  } else {
    const prog = getProg();
    if (cats.length > 1) rows.push(`<button class="srow" onclick="openPicker()"><span class="dot"></span>← ${esc(cat)}</button>`);
    roundList(cat).forEach(r => {
      const total = roundCount(cat, r);
      const doneN = Object.keys((prog[cat + '_' + r] || {}).answered || {}).length;
      rows.push(`<button class="srow" onclick="openDeck('round','${escArg(cat)}','${escArg(r)}')">
        <span class="dot"></span>${esc(r)}회차<span class="n">${doneN}/${total}</span></button>`);
    });
  }
  document.getElementById('sheet').innerHTML = rows.join('');
}

/* ── 밝게 / 어둡게 ── 기본은 밝게. 고른 값은 이 기기에 남는다 */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('study_theme', t); } catch (e) {}
  const b = document.getElementById('theme');
  if (b) b.textContent = (t === 'dark') ? '☀' : '☾';
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0D0F15' : '#EFF1F5');
}
function toggleTheme() {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

/* ── 진도 막대를 끌어서 문항 이동 ── */
(function bindBar() {
  const bar = document.getElementById('bar');
  let dragging = false;
  const at = (clientX) => {
    if (!deck) return 0;
    const r = bar.getBoundingClientRect();
    const t = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
    return Math.round(t * (deck.items.length - 1));
  };
  const go = (x) => {
    if (!deck) return;
    const i = at(x);
    if (i === deck.idx) return;
    deck.idx = i; render();
  };
  const down = (e) => {
    if (!deck) return;
    dragging = true; bar.classList.add('drag');
    go(e.touches ? e.touches[0].clientX : e.clientX);
    e.preventDefault();
  };
  const mv = (e) => { if (dragging) go(e.touches ? e.touches[0].clientX : e.clientX); };
  const up = () => {
    if (!dragging) return;
    dragging = false; bar.classList.remove('drag');
    if (deck && deck.kind === 'round') saveProgress();
    saveSpot();
  };
  bar.addEventListener('mousedown', down);
  bar.addEventListener('touchstart', down, { passive: false });
  window.addEventListener('mousemove', mv);
  window.addEventListener('touchmove', mv, { passive: true });
  window.addEventListener('mouseup', up);
  window.addEventListener('touchend', up);
})();

/* ── 폰 — 좌우로 밀어서 문항 이동 ── */
(function bindSwipe() {
  const st = document.getElementById('stage');
  let x0 = 0, y0 = 0, t0 = 0, on = false;
  st.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1 || document.body.classList.contains('sheet-open')) { on = false; return; }
    if (e.target.closest('textarea, #bar')) { on = false; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now(); on = true;
  }, { passive: true });
  st.addEventListener('touchend', (e) => {
    if (!on) return; on = false;
    const t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    const dx = t.clientX - x0, dy = t.clientY - y0;
    if (Date.now() - t0 > 700) return;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.3) return;
    move(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

/* ── 마지막 자리 (이 기기 전용) ── */
function saveSpot() {
  try {
    if (!deck) return;
    // 모의고사는 자리만 적어 두면 되살릴 수 없다 (낸 문제 목록이 있어야 한다) → study_mock 이 따로 맡는다
    if (deck.kind === 'mock' || deck.kind === 'mockreview') return;
    const it = deck.items[deck.idx];
    localStorage.setItem('study_spot', JSON.stringify({
      kind: deck.kind, cat: it.cat, round: it.round, idx: deck.idx, at: Date.now() }));
  } catch (e) {}
}
async function restoreSpot() {
  // 풀다 만 모의고사가 있으면 그것부터 되살린다 (제출하기 전에 창을 닫아도 이어서 풀 수 있게)
  const ms = loadMockSave();
  if (ms && (ms.picks || []).length && await resumeMock(ms)) return;
  let s = null;
  try { s = JSON.parse(localStorage.getItem('study_spot') || 'null'); } catch (e) {}
  if (s && Date.now() - (s.at || 0) < 30 * 24 * 3600 * 1000) {
    if (s.kind === 'round' && s.cat && s.round) { await openDeck('round', s.cat, s.round, s.idx); return; }
    if (s.kind) { await openDeck(s.kind); if (deck) { deck.idx = Math.min(s.idx || 0, deck.items.length - 1); render(); } return; }
  }
  // 처음이면 이어서 풀 자리, 그것도 없으면 첫 회차
  const bms = (() => { const v = _get('resume_bookmark', []); return Array.isArray(v) ? v : (v ? [v] : []); })();
  const bm = bms.length ? bms[bms.length - 1] : null;
  if (bm && bm.cat && roundCount(bm.cat, bm.round)) { await openDeck('round', bm.cat, bm.round); return; }
  const c = catList().filter(x => roundList(x).length)[0];
  if (c) { await openDeck('round', c, roundList(c)[0]); return; }
  showEmpty('등록된 문제가 없어요', '정식 화면에서 문제를 추가하세요');
}

/* ── 길게 누르기 (폰) / 오른쪽 막대 (PC) ── */
(function bindPress() {
  const main = document.getElementById('scroll');
  let timer = null, moved = false;
  const start = () => { moved = false; clearTimeout(timer); timer = setTimeout(() => { if (!moved) openTool(); }, 480); };
  const cancel = () => { clearTimeout(timer); };
  main.addEventListener('touchstart', (e) => {
    if (e.target.closest('button, textarea, a')) return;
    start();
  }, { passive: true });
  main.addEventListener('touchmove', () => { moved = true; cancel(); }, { passive: true });
  ['touchend','touchcancel'].forEach(ev => main.addEventListener(ev, cancel, { passive: true }));
  main.addEventListener('contextmenu', (e) => { if (!isWide()) e.preventDefault(); });
})();

// PC — 오른쪽 막대는 늘 흐리게 떠 있다가 마우스가 가면 또렷해진다
(function bindRail() {
  const t = document.getElementById('tool');
  const apply = () => {
    if (isWide()) { t.classList.add('rail'); t.style.pointerEvents = 'auto'; }
    else { t.classList.remove('rail'); t.style.pointerEvents = ''; }
  };
  window.addEventListener('resize', apply);
  t.addEventListener('mouseenter', () => { if (isWide()) t.classList.add('show'); });
  t.addEventListener('mouseleave', () => { if (isWide()) t.classList.remove('show'); });
  apply();
})();

/* ── 키보드 ── */
document.addEventListener('keydown', (e) => {
  if (document.getElementById('auth-gate').style.display === 'flex') return;
  const t = e.target;
  if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  const k = e.key;
  if (k === 'Escape') { if (lbOpen()) closeLightbox(); else closeAll(); return; }
  if (lbOpen()) return;                       // 크게 보는 중에는 문항이 넘어가지 않게
  if (!deck) return;
  if (/^[1-6]$/.test(k)) { pick(+k - 1); }
  else if (k === 'ArrowRight' || k === ' ') { move(1); }
  else if (k === 'ArrowLeft') { move(-1); }
  else if (k === 's' || k === 'S') { openTool(); }
  else if (k === 'c' || k === 'C') { tapFlag(); }
  else return;
  e.preventDefault();
});

/* ── 시작 ── */
const _parkAll = () => {
  if (deck && deck.kind === 'round') saveProgress();
  if (deck && deck.kind === 'mock') saveMock();
  saveSpot();
};
window.addEventListener('pagehide', _parkAll);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { _parkAll(); return; }
  // [추가] 이 화면은 열 때 한 번만 서버와 맞춘다. 탭을 오래 열어 둔 채 다른 화면에서
  //        기록을 바꾸고 돌아오면, 여기 있던 낡은 값이 새 것을 덮을 수 있었다.
  //        → 돌아올 때마다 조용히 다시 맞춘다.
  syncDown(true);
});

window._afterAuth = async function (user) {
  if (user) { await syncDown(true); }
  await restoreSpot();
};
applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
if (typeof AUTH_SETTLED !== 'undefined' && AUTH_SETTLED) window._afterAuth(AUTH_USER);
</script>
</body>
